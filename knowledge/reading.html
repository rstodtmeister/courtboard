or der leseansicht](../../../scripts/build-wiki-reader.py) und [benutzung](../../readme.md)\n\n## offene punkte\n\nautomatische ci-wiki-prüfung und verbindliche anwendungstest-gates sind mögliche folgearbeiten.\n", "meta": {"title": "Entscheidung zur LLM-Wiki", "updated": "2026-09-17", "status": "source-reviewed", "source_commit": "0fa17d309b986079df46f12883f9996d7c3af467"}}, {"id": "AGENTS.md", "title": "Wiki-Pflegeregeln", "body": "\u003ch1>Wiki-Pflegeregeln\u003c/h1>\n\u003cp>Diese Regeln ergänzen die \u003ca href=\"../AGENTS.md\">Projektanweisungen\u003c/a>. Vor Änderungen \u003ca href=\"#index.md\">Index\u003c/a>, relevante Themenseiten und Originalquellen lesen. Die Wiki ist abgeleitetes Wissen; bei Widersprüchen Code, Migrationen und Originalbelege prüfen.\u003c/p>\n\u003cul>\n\u003cli>Bestehende Seiten thematisch ergänzen. Rohquellen bewahren und verlinken statt duplizieren.\u003c/li>\n\u003cli>Themenseiten führen \u003ccode>title\u003c/code>, \u003ccode>updated\u003c/code>, \u003ccode>status\u003c/code> und vollständigen \u003ccode>source_commit\u003c/code>. Zulässige Statuswerte: \u003ccode>source-reviewed\u003c/code>, \u003ccode>historical-report\u003c/code>, \u003ccode>proposed\u003c/code>, \u003ccode>needs-review\u003c/code>. Der Quellen-Commit bezeichnet den gelesenen Repository-Stand, keinen Test- oder Deploymentnachweis.\u003c/li>\n\u003cli>Implementiert, Test vorhanden, Test bestanden und produktiv geprüft getrennt darstellen. Historische Berichte mit Datum und Umgebung einordnen; sie sind kein aktueller Testlauf.\u003c/li>\n\u003cli>Annahmen, Widersprüche und ungeprüfte Fälle als offene Punkte kennzeichnen. Produktionsstand nur mit datiertem Umgebungsnachweis behaupten.\u003c/li>\n\u003cli>Keine Secrets, Live-Spieltoken oder sensiblen Live-Daten aufnehmen.\u003c/li>\n\u003cli>Parallel schreibt nur der zugewiesene Wiki-Agent gemeinsame Seiten; Zuständigkeiten abstimmen.\u003c/li>\n\u003cli>Jede Themenseite enthält Quellen und offene Punkte und ist im Index verlinkt. \u003ca href=\"#log.md\">Log\u003c/a> append-only ergänzen; frühere Ereignisse nicht umdeuten.\u003c/li>\n\u003cli>Abschlussprüfung: \u003ccode>python3 scripts/check-knowledge.py\u003c/code>. Tatsächlichen Befehl, Ergebnis, Datum, Commit/Arbeitsbaum und Grenzen melden. Bloße Wiki-Pflege erfordert keine Anwendungstests oder Live-Aktionen.\u003c/li>\n\u003c/ul>\n\u003cp>Rollen und Übergaben stehen separat in \u003ca href=\"#agent-roles.md\">Agentenrollen\u003c/a>.\u003c/p>", "search": "# wiki-pflegeregeln\n\ndiese regeln ergänzen die [projektanweisungen](../../agents.md).\nvor änderungen [index](index.md), relevante themenseiten und originalquellen lesen.\ndie wiki ist abgeleitetes wissen; bei widersprüchen code, migrationen und originalbelege prüfen.\n\n- bestehende seiten thematisch ergänzen. rohquellen bewahren und verlinken statt duplizieren.\n- themenseiten führen `title`, `updated`, `status` und vollständigen `source_commit`.\n  zulässige statuswerte: `source-reviewed`, `historical-report`, `proposed`, `needs-review`.\n  der quellen-commit bezeichnet den gelesenen repository-stand, keinen test- oder deploymentnachweis.\n- implementiert, test vorhanden, test bestanden und produktiv geprüft getrennt darstellen.\n  historische berichte mit datum und umgebung einordnen; sie sind kein aktueller testlauf.\n- annahmen, widersprüche und ungeprüfte fälle als offene punkte kennzeichnen.\n  produktionsstand nur mit datiertem umgebungsnachweis behaupten.\n- keine secrets, live-spieltoken oder sensiblen live-daten aufnehmen.\n- parallel schreibt nur der zugewiesene wiki-agent gemeinsame seiten; zuständigkeiten abstimmen.\n- jede themenseite enthält quellen und offene punkte und ist im index verlinkt.\n  [log](log.md) append-only ergänzen; frühere ereignisse nicht umdeuten.\n- abschlussprüfung: `python3 scripts/check-knowledge.py`. tatsächlichen befehl,\n  ergebnis, datum, commit/arbeitsbaum und grenzen melden. bloße wiki-pflege erfordert\n  keine anwendungstests oder live-aktionen.\n\nrollen und übergaben stehen separat in [agentenrollen](agent-roles.md).\n", "meta": {}}, {"id": "log.md", "title": "Wiki-Aktualisierungslog", "body": "\u003ch1>Wiki-Aktualisierungslog\u003c/h1>\n\u003cp>Neue Einträge anhängen; frühere Ereignisse nicht nachträglich umdeuten.\u003c/p>\n\u003ch2>[2026-09-17] ingest | Ersteinrichtung\u003c/h2>\n\u003cul>\n\u003cli>Nutzeranforderungen als unveränderten Eingangsbeleg aufgenommen.\u003c/li>\n\u003cli>Projektquellen am Commit \u003ccode>0fa17d309b986079df46f12883f9996d7c3af467\u003c/code> gelesen.\u003c/li>\n\u003cli>Architektur, Erfassung, Protokolle, Tests, Betrieb und Agentenrollen verlinkt.\u003c/li>\n\u003cli>Testberichte vom 11.09.2026 ausdrücklich als historische Nachweise eingeordnet.\u003c/li>\n\u003cli>Kein aktueller Anwendungstestlauf und keine produktive Supabase-Prüfung behauptet.\u003c/li>\n\u003cli>Strukturprüfung \u003ccode>python3 scripts/check-knowledge.py\u003c/code> erfolgreich: lokale Links, Indexabdeckung und Pflichtmetadaten gültig.\u003c/li>\n\u003cli>\u003ccode>git diff --check\u003c/code> erfolgreich; die neu angelegten Dateien waren dabei noch unversioniert.\u003c/li>\n\u003cli>Keine Anwendungsdateien, CI-Konfiguration oder Live-Daten geändert.\u003c/li>\n\u003c/ul>\n\u003ch2>[2026-09-17] ingest | Projekt-Subagenten eingerichtet\u003c/h2>\n\u003cul>\n\u003cli>Acht benannte Agenten in \u003ccode>.codex/agents/\u003c/code> angelegt; Hauptagent bleibt Koordinator.\u003c/li>\n\u003cli>Datenbank und Backend getrennt; unabhängiger Test-Agent mit Nachweispflicht eingerichtet.\u003c/li>\n\u003cli>Sicherheitsreview lesend konfiguriert; Modelle und übrige Berechtigungen werden geerbt.\u003c/li>\n\u003cli>Projektkonfiguration begrenzt gleichzeitig offene Subagenten auf drei.\u003c/li>\n\u003cli>Rollenübersicht und gemeinsame Projektanweisungen aktualisiert.\u003c/li>\n\u003cli>Kein Anwendungstest, Deployment oder Modellaufruf zur Laufzeitaktivierung durchgeführt.\u003c/li>\n\u003cli>Prüfung erfolgreich: acht TOML-Dateien, eindeutige Namen, Pflichtfelder, Modellvererbung und Wiki-Verlinkung.\u003c/li>\n\u003cli>\u003ccode>codex features list\u003c/code> erfolgreich; dies ist kein Laufzeitnachweis für die Agentenauswahl.\u003c/li>\n\u003cli>Strenge CLI-Prüfung über \u003ccode>codex --strict-config features list\u003c/code> nicht verfügbar: Unterbefehl unterstützt die Option nicht.\u003c/li>\n\u003c/ul>\n\u003ch2>[2026-09-17] reconcile | Wiki gegen Quellenstand abgeglichen\u003c/h2>\n\u003cul>\n\u003cli>Quellen: HEAD \u003ccode>0fa17d309b986079df46f12883f9996d7c3af467\u003c/code>, jüngste 45 Git-Einträge, aktuelle Frontend-/Edge-/Migrationsquellen, vorhandene Testdateien und sechs Reportthemen. Wissensdateien und Agentenkonfiguration sind im Arbeitsbaum noch unversioniert.\u003c/li>\n\u003cli>Öffentliche Ansichten/Team-Begleiter/Fotos, HVV-Import/Schiedsrichter und YouTube-Replays ergänzt; belegte Implementierungsentscheidungen mit Commitreferenzen aufgenommen.\u003c/li>\n\u003cli>Erfassung korrigiert: aktueller automatischer Konfliktabgleich übernimmt Serverstand, leert blockierte Pending-Operationen und führt keinen Merge aus. Spielerbezeichnungen und spätere Protokoll-/Admin-/Rechteänderungen ergänzt.\u003c/li>\n\u003cli>Fehlerhafte Dateibelegung behoben: bisheriger Rolleninhalt von \u003ccode>AGENTS.md\u003c/code> in \u003ccode>agents.md\u003c/code> bewahrt; tatsächliche Wiki-Pflegeregeln in \u003ccode>AGENTS.md\u003c/code> hergestellt. Historische Logeinträge bleiben unverändert; ihre damalige Strukturprüfung wurde hier nicht erneut behauptet.\u003c/li>\n\u003cli>Historische Last-/Neustartberichte ergänzt, einschließlich ungeklärtem Timeout des ersten Performanceversuchs und Grenzen von HTTP-/Mock-/PGlite-/gehosteten Nachweisen.\u003c/li>\n\u003cli>Tatsächliche Prüfung: \u003ccode>python3 scripts/check-knowledge.py\u003c/code>, lokal am 17.09.2026, erfolgreich: lokale Links, Indexabdeckung und Pflichtmetadaten gültig.\u003c/li>\n\u003cli>Keine Anwendungstests, Live-Prüfungen oder Deployments ausgeführt. Strukturprüfung bestätigt keine semantische Vollständigkeit. Detailprüfung aller Java-/Adminpfade und heutige E2E-/Foto-Storage-/HVV-Nachweise bleiben offene Punkte.\u003c/li>\n\u003c/ul>\n\u003ch2>[2026-09-17] presentation | Lokale Wiki-Leseansicht\u003c/h2>\n\u003cul>\n\u003cli>Nutzerwunsch: Wiki-Inhalte gut aufbereitet lesen. Akzeptanzkriterien: alle Wiki-Seiten aus Markdown erzeugen, Themen-Navigation, Volltextfilter, Quellenstand/Testgrenzen, lokale Quellenlinks und Druckansicht; offline ohne zusätzliche Pakete öffnen.\u003c/li>\n\u003cli>\u003ca href=\"../scripts/build-wiki-reader.py\">Generator\u003c/a> und \u003ca href=\"../knowledge/reading.html\">Leseansicht\u003c/a> ergänzt. \u003ca href=\"../knowledge/README.md\">Benutzung\u003c/a>, Index und Wiki-Entscheidung aktualisiert. Die HTML-Datei ist eine Momentaufnahme und wird nach Wiki-Änderungen neu erzeugt.\u003c/li>\n\u003cli>Nachprüfung entdeckte einen Fehler im vorherigen Abgleich: \u003ccode>agents.md\u003c/code> kollidiert mit \u003ccode>AGENTS.md\u003c/code> auf diesem Dateisystem. Die behauptete Trennung war dadurch nicht erhalten geblieben. Rollen unter \u003ca href=\"#agent-roles.md\">agent-roles.md\u003c/a> wiederhergestellt; aktive Links korrigiert. Frühere Logeinträge bleiben als historische Aussagen erhalten.\u003c/li>\n\u003cli>Strukturprüfung prüft nun auch exakte Groß-/Kleinschreibung lokaler Linkziele.\u003c/li>\n\u003cli>Tatsächliche lokale Prüfungen: \u003ccode>python3 scripts/check-knowledge.py\u003c/code> erfolgreich; \u003ccode>python3 scripts/build-wiki-reader.py\u003c/code> erzeugt 15 unterschiedliche Wiki-Seiten. Python-Smokeprüfung bestätigt Seitenabdeckung, interne/Quellenlinks sowie Ablehnung des falschen Dateinamens. \u003ccode>node --check\u003c/code> für erzeugtes Client-JavaScript erfolgreich. Node/VM mit DOM-Testdouble prüft Volltextfilter, leere Trefferliste, Themenwechsel, unbekanntes Thema und Druckaktion erfolgreich; dies ist kein Browser-Interaktionstest.\u003c/li>\n\u003cli>Vorhandener Chromium rendert Startseite und Navigation mittels \u003ccode>--dump-dom\u003c/code>. Erster Browserstart in der Sandbox scheiterte an macOS-Prozessrechten; der genehmigte Start außerhalb der Sandbox war erfolgreich. Keine Prüfung echter Druck-/PDF-Ausgabe oder vollständige visuelle Prüfung auf Mobilgeräten. Keine Anwendungs-/Live-Tests.\u003c/li>\n\u003cli>Quellenstand weiterhin \u003ccode>0fa17d309b986079df46f12883f9996d7c3af467\u003c/code> plus lokale Änderungen.\u003c/li>\n\u003c/ul>\n\u003ch2>[2026-09-17] rules | Wiederholungsschleifen begrenzen\u003c/h2>\n\u003cul>\n\u003cli>Auf Nutzerauftrag den zuvor vorgeschlagenen Abschnitt „Schleifen vermeiden“ unverändert in die \u003ca href=\"../AGENTS.md\">Projektanweisungen\u003c/a> aufgenommen.\u003c/li>\n\u003cli>Höchstens drei Versuche desselben fehlgeschlagenen Schritts; Ursachenprüfung, begründete Wiederholung, Auswertung gestoppter Lösungswege und Sicherung bei Blockaden. Erfolgreiche Tests nur bei relevanten Änderungen oder konkreten Zweifeln wiederholen. Der Hauptagent überwacht die Regeln auch für Subagenten.\u003c/li>\n\u003cli>\u003ca href=\"#agent-roles.md\">Agentenrollen\u003c/a> und Index ergänzt. Verhaltensregel ausdrücklich von einem technisch erzwungenen Versuchszähler unterschieden.\u003c/li>\n\u003cli>Tatsächliche lokale Prüfung: \u003ccode>python3 scripts/check-knowledge.py\u003c/code> erfolgreich am 17.09.2026; Links, Index und Pflichtmetadaten gültig. Reine Anweisungs-/Wiki-Änderung, keine Anwendungstests oder Live-Aktionen. Wissensdateien weiterhin unversioniert.\u003c/li>\n\u003c/ul>\n\u003ch2>[2026-09-19] frontend | Eindeutige Livestream-Aktionen\u003c/h2>\n\u003cul>\n\u003cli>Unter Courts → Livestream sind „Stream speichern“ und „Stream entfernen“ getrennte Schaltflächen. Speichern ist nur für einen nicht leeren, geänderten Entwurf aktiv; Entfernen nur bei einem gespeicherten Stream. Die ausgelöste Aktion zeigt ihren eigenen Fortschrittszustand.\u003c/li>\n\u003cli>Zustandstest für leere, neue, unveränderte, geänderte und geleerte Eingaben ergänzt.\u003c/li>\n\u003cli>Tatsächliche lokale Prüfungen auf HEAD \u003ccode>0fa17d309b986079df46f12883f9996d7c3af467\u003c/code> mit lokalen Änderungen: gezielter Court-Test und TypeScript-Prüfung erfolgreich. Der vollständige \u003ccode>npm --prefix web-admin run check\u003c/code> lief bis einschließlich Referee-Tests erfolgreich, bevor die Werkzeug-Zeitgrenze die Ausgabe beendete; die ausstehenden Companion-Tests und der Produktionsbuild wurden separat erfolgreich ausgeführt.\u003c/li>\n\u003cli>Kein Live-YouTube-Abruf und keine Supabase-Prüfung.\u003c/li>\n\u003cli>Nachträglicher Browser-Nachweis: \u003ccode>node scripts/test-court-stream-browser.mjs\u003c/code> steuerte Google Chrome headless bei 390 × 844 Pixeln und bestätigte Eingabe, Speichern, unveränderten/geänderten Zustand, Entfernen, Rücksetzen des Feldes und mobile Breite. Dafür wurde \u003ccode>playwright-core\u003c/code> temporär nur unter dem ignorierten \u003ccode>node_modules\u003c/code> ergänzt; Manifest und Lockfile blieben unverändert. Kein Backend- oder Live-YouTube-Aufruf.\u003c/li>\n\u003c/ul>\n\u003ch2>[2026-09-19] frontend | Mobile Einrichtung des Aufzeichnungsbeginns\u003c/h2>\n\u003cul>\n\u003cli>Dauerhaft sichtbare Videozeit-Felder durch eine einmalige mobile Einrichtung ersetzt: aktuelle Gerätezeit direkt speichern, von YouTube übernehmen oder anderen Zeitpunkt wählen.\u003c/li>\n\u003cli>Nach der Einrichtung bleiben Zeitpunkt, Quelle und „Einstellung ändern“ sichtbar. Videoauswahl erscheint nur bei mehreren Aufzeichnungen; Versatz und ±5-Sekunden-Schritte liegen unter „Feineinstellung“. Aktionen sind untereinander angeordnet und mindestens 48 Pixel hoch.\u003c/li>\n\u003cli>Tatsächliche lokale Prüfungen auf HEAD \u003ccode>4351b5717318ff4231d202aacbb15de3b5daa85b\u003c/code> mit lokalen Änderungen: mobiler Playwright-/Chrome-Lauf bei 390 × 844 Pixeln, <script>
const pages=JSON.parse(document.getElementById('wiki-data').textContent);
const nav=document.getElementById('navigation'),content=document.getElementById('content');
const statusNames={'source-reviewed':'Quellen geprüft','historical-report':'Historischer Bericht','proposed':'Vorschlag','needs-review':'Prüfung offen'};
function currentId(){try{return decodeURIComponent(location.hash.slice(1))||'index.md'}catch{return 'index.md'}}
function navigate(){const page=pages.find(p=>p.id===currentId())||pages[0];content.innerHTML=page.body;
 const meta=page.meta;if(meta.updated){const box=document.createElement('div');box.className='metadata';box.textContent=`Stand: ${meta.updated} · ${statusNames[meta.status]||meta.status} · Quellen-Commit: ${(meta.source_commit||'').slice(0,7)}. Dies ist kein aktueller Test- oder Produktionsnachweis.`;content.querySelector('h1')?.after(box)}
 const footer=document.createElement('p');footer.className='source';const link=document.createElement('a');link.href='wiki/'+page.id;link.textContent='Markdown-Quelle öffnen';footer.append(link);content.append(footer);
 document.title=page.title+' · CourtBoard';document.getElementById('position').textContent='Wissen / '+page.title;
 for(const a of nav.querySelectorAll('a')){const active=a.dataset.id===page.id;a.classList.toggle('active',active);if(active)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')}
}
function filter(){const query=document.getElementById('search').value.toLocaleLowerCase('de').trim();let count=0;nav.replaceChildren();
 for(const page of pages){if(query&&!page.search.includes(query)&&!page.title.toLocaleLowerCase('de').includes(query))continue;count++;const a=document.createElement('a');a.href='#'+encodeURI(page.id);a.dataset.id=page.id;a.textContent=page.title;nav.append(a)}
 document.getElementById('count').textContent=query?`${count} passende Themen`:`${count} Seiten`;navigate();}
document.getElementById('search').addEventListener('input',filter);document.getElementById('print').addEventListener('click',()=>window.print());
window.addEventListener('hashchange',()=>{navigate();window.scrollTo(0,0)});filter();
</script></body></html>
