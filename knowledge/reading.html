ions/implementation.md) | aus git/code belegte technische entscheidungen und grenzen |\n| [teststrategie](testing/strategy.md) | prüfungen, verantwortlichkeiten und ci-lücken |\n| [testnachweise](testing/evidence.md) | historische ergebnisse und vorlage für neue läufe |\n| [betrieb](operations/deployment.md) | deployment, konfiguration und grenzen |\n| [agentenrollen](agent-roles.md) | rollen, übergaben und regeln gegen wiederholungsschleifen |\n| [wiki-entscheidung](decisions/llm-wiki.md) | zweck und gewählte umsetzung |\n\n[pflegeregeln](agents.md) · [aktualisierungslog](log.md) · [benutzung](../readme.md)\n", "meta": {}}, {"id": "architecture/overview.md", "title": "Architektur", "body": "\u003ch1>Architektur\u003c/h1>\n\u003cp>CourtBoard umfasst eine React-19-/TypeScript-Webanwendung mit Vite, Supabase Auth, Postgres und Edge Functions sowie eine bestehende Java-Anwendung mit lokaler API. GitHub Pages veröffentlicht das statische Frontend. Der Browser nutzt den Supabase-Client mit öffentlichen Konfigurationswerten; privilegierte Integrationen laufen im Backend. Der Datenadapter unterstützt lokalen und Supabase-Betrieb. Die Betriebsarten haben unterschiedliche Garantien; Cloud-Outbox und serverseitige Protokolle nicht pauschal auf den lokalen Java-Betrieb übertragen.\u003c/p>\n\u003cp>Frontendbereiche: Adminverwaltung, mobile Ergebniserfassung, Court-Anzeige, Teamansichten. Edge Functions übernehmen unter anderem Spielsync, Ergebnisabgabe, Adminverwaltung, HVV-Auslieferung und YouTube-Metadaten. SQL-Migrationen definieren Schema und Zugriffsregeln.\u003c/p>\n\u003cp>Siehe \u003ca href=\"#features/scoring.md\">Erfassung\u003c/a>, \u003ca href=\"#testing/strategy.md\">Tests\u003c/a> \u003ca href=\"#features/public-views.md\">öffentlichen Ansichten\u003c/a>, \u003ca href=\"#features/hvv-referees.md\">HVV\u003c/a>, \u003ca href=\"#features/youtube-replays.md\">Replays\u003c/a> und \u003ca href=\"#operations/deployment.md\">Betrieb\u003c/a>.\u003c/p>\n\u003ch2>Quellen\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"../web-admin/package.json\">Webprojekt\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"../web-admin/src/supabase.ts\">Supabase-Client\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"../docs/web-admin-setup.md\">Einrichtungsdokumentation\u003c/a> — historisch gewachsen; enthält auch frühere Planstände.\u003c/li>\n\u003cli>\u003ca href=\"../pom.xml\">Java-Build\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"../.github/workflows/deploy-pages.yml\">Deployment-Workflow\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch2>Offene Punkte\u003c/h2>\n\u003cp>Der tatsächliche produktive Schema-/Funktionsstand wurde bei der Wiki-Einrichtung nicht geprüft.\u003c/p>", "search": "\n# architektur\n\ncourtboard umfasst eine react-19-/typescript-webanwendung mit vite, supabase auth,\npostgres und edge functions sowie eine bestehende java-anwendung mit lokaler api.\ngithub pages veröffentlicht das statische frontend. der browser nutzt den supabase-client\nmit öffentlichen konfigurationswerten; privilegierte integrationen laufen im backend.\nder datenadapter unterstützt lokalen und supabase-betrieb. die betriebsarten haben\nunterschiedliche garantien; cloud-outbox und serverseitige protokolle nicht pauschal\nauf den lokalen java-betrieb übertragen.\n\nfrontendbereiche: adminverwaltung, mobile ergebniserfassung, court-anzeige, teamansichten.\nedge functions übernehmen unter anderem spielsync, ergebnisabgabe, adminverwaltung,\nhvv-auslieferung und youtube-metadaten. sql-migrationen definieren schema und zugriffsregeln.\n\nsiehe [erfassung](../features/scoring.md), [tests](../testing/strategy.md)\n[öffentlichen ansichten](../features/public-views.md),\n[hvv](../features/hvv-referees.md), [replays](../features/youtube-replays.md)\nund [betrieb](../operations/deployment.md).\n\n## quellen\n\n- [webprojekt](../../../web-admin/package.json)\n- [supabase-client](../../../web-admin/src/supabase.ts)\n- [einrichtungsdokumentation](../../../docs/web-admin-setup.md) — historisch gewachsen; enthält auch frühere planstände.\n- [java-build](../../../pom.xml)\n- [deployment-workflow](../../../.github/workflows/deploy-pages.yml)\n\n## offene punkte\n\nder tatsächliche produktive schema-/funktionsstand wurde bei der wiki-einrichtung nicht geprüft.\n", "meta": {"title": "Architektur", "updated": "2026-09-17", "status": "source-reviewed", "source_commit": "0fa17d309b986079df46f12883f9996d7c3af467"}}, {"id": "features/scoring.md", "title": "Zuverlässige Ergebniserfassung", "body": "\u003ch1>Zuverlässige Ergebniserfassung\u003c/h1>\n\u003cp>Der Bericht vom 11.09.2026 beschreibt eine versionierte, atomare Ergebnisspeicherung: Operationskennung und erwartete Spielrevision verhindern veraltete Überschreibungen; identische Wiederholungen erhalten dieselbe Bestätigung. Court-/Gerätesperren grenzen Schreibzugriffe ein. Die Cloud-Outbox hält offene Eingaben lokal und übersteht Neuladen. „Lokal gesichert“ bedeutet noch nicht „vom Server bestätigt“. Aktuell werden Revisionskonflikte online automatisch zugunsten des autoritativen Serverstands aufgelöst; es findet kein Zusammenführen lokaler und fremder Punkte statt. HVV-Auslieferung hat einen eigenen Status.\u003c/p>\n\u003cp>Die Einrichtungsdokumentation beschreibt später die gemeinsame Speicherung von Punkten und Erfassungszustand für Gerätewechsel. Vor dem Wechsel müssen offene Eingaben bestätigt werden. Browserprofilverlust kann ausschließlich lokal wartende Eingaben verlieren.\u003c/p>\n\u003cp>Historischer Nachweis: 241 Speicherungen unter Zuschauerlast ohne Speicherfehler im berichteten kurzen Supabase-Lauf. Das ist keine heutige Kapazitäts- oder Dauerlastgarantie. Siehe \u003ca href=\"#testing/evidence.md\">Nachweise\u003c/a> und \u003ca href=\"#testing/strategy.md\">Tests\u003c/a>.\u003c/p>\n\u003cp>Bei gleichen Spielernachnamen können unterscheidbare Bezeichnungen eingegeben werden. Sie gelten für Kapitän und Aufschlagreihenfolge und werden im Score-Session-Zustand für Gerätewechsel erhalten (\u003ccode>5937a46\u003c/code>).\u003c/p>\n\u003ch2>Aktueller Konfliktabgleich\u003c/h2>\n\u003cp>Die Historie \u003ccode>724a533\u003c/code> dokumentiert zunächst eine manuelle Wiederherstellung mit Sicherung; \u003ccode>61a2a4d\u003c/code> ersetzt diesen Ablauf durch automatische Wiederaufnahme. \u003ccode>ScoreSyncStatus\u003c/code> lädt bei Revisionskonflikt online den Serverstand, sofern weder Speicherung noch Storagefehler anstehen; Fehler werden erneut versucht. Bis dahin bleibt die Queue blockiert. \u003ccode>adoptServer\u003c/code> ersetzt Revision und Entwurf und leert die blockierten Pending-Operationen. Das kann unbestätigte lokale Änderungen ersetzen; sie werden nicht nachträglich eingemischt. Andere blockierte Sitzungen verweisen an die Turnierleitung. Die historische Beschreibung von 11.09. beschreibt deshalb nicht den vollständigen heutigen Bedienablauf.\u003c/p>\n\u003ch2>Quellen\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"../docs/reports/reliable-scoring-2026-09-11.md\">Bericht zur zuverlässigen Erfassung\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"../docs/reports/reliable-scoring-2026-09-11.json\">Rohmessungen\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"../docs/web-admin-setup.md\">Gerätewechsel-Dokumentation\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"../web-admin/src/ScoreSyncStatus.tsx\">Automatische Wiederaufnahme\u003c/a> und \u003ca href=\"../web-admin/src/ScoreEntryApp.tsx\">Übernahme des Serverstands\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"../web-admin/src/scoreEntrySteps.tsx\">Spielerbezeichnungen\u003c/a> und \u003ca href=\"../web-admin/src/scoreSession.ts\">Sitzungsserialisierung\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"../web-admin/tests/score-outbox.test.mjs\">Konflikttests\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"../web-admin/src/scoreOutbox.ts\">Outbox-Implementierung\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"../supabase/migrations/20260911080000_reliable_score_operations.sql\">Atomare Operationen\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"../supabase/migrations/20260913090000_persist_score_session.sql\">Persistierter Zustand\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch2>Offene Punkte\u003c/h2>\n\u003cp>Die historischen Läufe wurden nicht für den aktuellen Commit wiederholt. Cloud-, Browser-Mock- und lokale Java-Garantien müssen bei Änderungen separat geprüft werden.\u003c/p>", "search": "\n# zuverlässige ergebniserfassung\n\nder bericht vom 11.09.2026 beschreibt eine versionierte, atomare ergebnisspeicherung:\noperationskennung und erwartete spielrevision verhindern veraltete überschreibungen;\nidentische wiederholungen erhalten dieselbe bestätigung. court-/gerätesperren grenzen\nschreibzugriffe ein. die cloud-outbox hält offene eingaben lokal und übersteht neuladen.\n„lokal gesichert“ bedeutet noch nicht „vom server bestätigt“. aktuell werden revisionskonflikte online automatisch zugunsten des autoritativen\nserverstands aufgelöst; es findet kein zusammenführen lokaler und fremder punkte statt. hvv-auslieferung hat einen eigenen status.\n\ndie einrichtungsdokumentation beschreibt später die gemeinsame speicherung von punkten\nund erfassungszustand für gerätewechsel. vor dem wechsel müssen offene eingaben bestätigt\nwerden. browserprofilverlust kann ausschließlich lokal wartende eingaben verlieren.\n\nhistorischer nachweis: 241 speicherungen unter zuschauerlast ohne speicherfehler im\nberichteten kurzen supabase-lauf. das ist keine heutige kapazitäts- oder dauerlastgarantie.\nsiehe [nachweise](../testing/evidence.md) und [tests](../testing/strategy.md).\n\nbei gleichen spielernachnamen können unterscheidbare bezeichnungen eingegeben werden.\nsie gelten für kapitän und aufschlagreihenfolge und werden im score-session-zustand\nfür gerätewechsel erhalten (`5937a46`).\n\n## aktueller konfliktabgleich\n\ndie historie `724a533` dokumentiert zunächst eine manuelle wiederherstellung mit sicherung;\n`61a2a4d` ersetzt diesen ablauf durch automatische wiederaufnahme. `scoresyncstatus` lädt\nbei revisionskonflikt online den serverstand, sofern weder speicherung noch storagefehler\nanstehen; fehler werden erneut versucht. bis dahin bleibt die queue blockiert.\n`adoptserver` ersetzt revision und entwurf und leert die blockierten pending-operationen.\ndas kann unbestätigte lokale änderungen ersetzen; sie werden nicht nachträglich eingemischt.\nandere blockierte sitzungen verweisen an die turnierleitung. die historische beschreibung\nvon 11.09. beschreibt deshalb nicht den vollständigen heutigen bedienablauf.\n\n## quellen\n\n- [bericht zur zuverlässigen erfassung](../../../docs/reports/reliable-scoring-2026-09-11.md)\n- [rohmessungen](../../../docs/reports/reliable-scoring-2026-09-11.json)\n- [gerätewechsel-dokumentation](../../../docs/web-admin-setup.md)\n- [automatische wiederaufnahme](../../../web-admin/src/scoresyncstatus.tsx) und [übernahme des serverstands](../../../web-admin/src/scoreentryapp.tsx)\n- [spielerbezeichnungen](../../../web-admin/src/scoreentrysteps.tsx) und [sitzungsserialisierung](../../../web-admin/src/scoresession.ts)\n- [konflikttests](../../../web-admin/tests/score-outbox.test.mjs)\n- [outbox-implementierung](../../../web-admin/src/scoreoutbox.ts)\n- [atomare operationen](../../../supabase/migrations/20260911080000_reliable_score_operations.sql)\n- [persistierter zustand](../../../supabase/migrations/20260913090000_persist_score_session.sql)\n\n## offene punkte\n\ndie historischen läufe wurden nicht für den aktuellen commit wiederholt.\ncloud-, browser-mock- und lokale java-garantien müssen bei änderungen separat geprüft werden.\n", "meta": {"title": "Zuverlässige Ergebniserfassung", "updated": "2026-09-17", "status": "source-reviewed", "source_commit": "0fa17d309b986079df46f12883f9996d7c3af467"}}, {"id": "features/protocols.md", "title": "Spielprotokolle", "body": "\u003ch1>Spielprotokolle\u003c/h1>\n\u003cp>Laut Bericht vom 11.09.2026 zeichnen Datenbanktrigger bestätigte Änderungen in derselben Transaktion wie das Spiel auf. Identische Wiederholungen erzeugen keine doppelten Ereignisse. Die Adminansicht lädt Detailereignisse seitenweise; JSON/PDF-Exports verwenden eine feste Ereignisgrenze je Spiel. Protokolle sind privat und auf erlaubte Turniere beschränkt. Ein einzelnes gelöschtes Spiel behält sein Archiv; Turnierlöschung entfernt die Protokolle.\u003c/p>\n\u003cp>Ein Ergebnislink ist kein persönlicher Identitätsnachweis. Offline-Eingaben haben einen serverseitigen Aufzeichnungszeitpunkt, der vom tatsächlichen Punktzeitpunkt abweichen kann. Die Archivierung ist nicht extern unveränderlich oder kryptografisch signiert. Der Bericht nennt einen behobenen Grenzfall bei leeren Historien mit Regressionstest. Siehe \u003ca href=\"#testing/evidence.md\">Nachweise\u003c/a>.\u003c/p>\n\u003ch2>Spätere Darstellungsänderungen\u003c/h2>\n\u003cp>Nach dem ursprünglichen Bericht wurden Score-Ereignisse als aufklappbare Zeilen mit kompakter Satzhistorie zusammengefasst (\u003ccode>99c0a08\u003c/code>, \u003ccode>3adeb8d\u003c/code>). Die PDF-Zusammenfassung packt mehrere Spiele auf gemeinsame Seiten (\u003ccode>0c2d108\u003c/code>); sie ist ein kompaktes Exportformat, kein vollständiger Ersatz für sämtliche Detailereignisse. Quellenstand ist der aktuelle Repository-HEAD; der Bericht von 11.09. bleibt ein historischer Nachweis.\u003c/p>\n\u003ch2>Quellen\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"../docs/reports/game-protocols-2026-09-11.md\">Umsetzung und Prüfbericht\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"../docs/reports/game-protocols-2026-09-11.json\">Rohdaten\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"../supabase/tests/game_protocols.sql\">SQL-Tests\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"../web-admin/src/admin/ProtocolEventItem.tsx\">Ereigniszeilen\u003c/a> und \u003ca href=\"../web-admin/src/protocolPdf.ts\">PDF\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"../web-admin/tests/game-protocols.test.mjs\">Frontend-Tests\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"../scripts/test-protocol-browser.mjs\">Browser-Test\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch2>Offene Punkte\u003c/h2>\n\u003cp>Aktuelle Testläufe und produktive Zugriffsregeln sind bei Einrichtung nicht neu verifiziert worden.\u003c/p>", "search": "\n# spielprotokolle\n\nlaut bericht vom 11.09.2026 zeichnen datenbanktrigger bestätigte änderungen in derselben\ntransaktion wie das spiel auf. identische wiederholungen erzeugen keine doppelten ereignisse.\ndie adminansicht lädt detailereignisse seitenweise; json/pdf-exports verwenden eine feste\nereignisgrenze je spiel. protokolle sind privat und auf erlaubte turniere beschränkt.\nein einzelnes gelöschtes spiel behält sein archiv; turnierlöschung entfernt die protokolle.\n\nein ergebnislink ist kein persönlicher identitätsnachweis. offline-eingaben haben einen\nserverseitigen aufzeichnungszeitpunkt, der vom tatsächlichen punktzeitpunkt abweichen kann.\ndie archivierung ist nicht extern unveränderlich oder kryptografisch signiert.\nder bericht nennt einen behobenen grenzfall bei leeren historien mit regressionstest.\nsiehe [nachweise](../testing/evidence.md).\n\n## spätere darstellungsänderungen\n\nnach dem ursprünglichen bericht wurden score-ereignisse als aufklappbare zeilen mit\nkompakter satzhistorie zusammengefasst (`99c0a08`, `3adeb8d`). die pdf-zusammenfassung\npackt mehrere spiele auf gemeinsame seiten (`0c2d108`); sie ist ein kompaktes exportformat,\nkein vollständiger ersatz für sämtliche detailereignisse. quellenstand ist der aktuelle\nrepository-head; der bericht von 11.09. bleibt ein historischer nachweis.\n\n## quellen\n\n- [umsetzung und prüfbericht](../../../docs/reports/game-protocols-2026-09-11.md)\n- [rohdaten](../../../docs/reports/game-protocols-2026-09-11.json)\n- [sql-tests](../../../supabase/tests/game_protocols.sql)\n- [ereigniszeilen](../../../web-admin/src/admin/protocoleventitem.tsx) und [pdf](../../../web-admin/src/protocolpdf.ts)\n- [frontend-tests](../../../web-admin/tests/game-protocols.test.mjs)\n- [browser-test](../../../scripts/test-protocol-browser.mjs)\n\n## offene punkte\n\naktuelle testläufe und produktive zugriffsregeln sind bei einrichtung nicht neu verifiziert worden.\n", "meta": {"title": "Spielprotokolle", "updated": "2026-09-17", "status": "source-reviewed", "source_commit": "0fa17d309b986079df46f12883f9996d7c3af467"}}, {"id": "features/public-views.md", "title": "Öffentliche Anzeigen und Team-Begleiter", "body": "\u003ch1>Öffentliche Anzeigen und Team-Begleiter\u003c/h1>\n\u003cp>Die Routen unterstützen Courts, Gruppen, Stream-Overlay und eine persönliche Teamseite. Die Teamfavoriten werden je Turnier im Browser gehalten; Gruppen-/Pool- und Bracket-Platzhalter sind keine auswählbaren Teamidentitäten. Teamseiten sind über URL teilbar. Der Begleiter zeigt ausstehende Spiele und Schiedsrichterdienste samt vorausgehenden Spielen auf demselben Court. Gewinner-/Verliererreferenzen werden nur aus abgeschlossenen Ergebnissen aufgelöst; unbekannte Referenzen bleiben sichtbar. Ergebnisse werden aus Sicht des gewählten Teams angezeigt, einschließlich Satzständen und Sonderwertungen.\u003c/p>\n\u003cp>Punktverlauf und Auszeiten verwenden die gemeinsame PointFlow-Darstellung. Diese öffentlichen Ergebnisdaten sind vom privaten \u003ca href=\"#features/protocols.md\">Adminprotokoll\u003c/a> zu unterscheiden. Die Übersicht fragt kompakte Spielzusammenfassungen ab; detaillierte Verläufe werden bei Bedarf geladen. Der historisch dokumentierte Fünf-Sekunden-Abfragezyklus ist keine Echtzeitgarantie.\u003c/p>\n\u003cp>Teamfotos sind im Adminbereich je Turnier und Setznummer zugeordnet. Der Editor erstellt einen 512×512-WebP-Ausschnitt mit Verschieben und Zoom; die Anzeige verwendet öffentliche Storage-URLs. Dateiupload und Metadaten-Upsert sind getrennte Schritte. Im lokalen Datenmodus liefert die Fotoliste derzeit keine Fotos. Uploadrechte betreffen berechtigte Turnieradmins.\u003c/p>\n\u003ch2>Quellen\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"../web-admin/src/appRoutes.tsx\">Routen\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"../web-admin/src/MyTeam.tsx\">Favoriten\u003c/a> und \u003ca href=\"../web-admin/src/teamNames.ts\">Teamfilter\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"../web-admin/src/teamCompanionLogic.ts\">Begleiterlogik\u003c/a> und \u003ca href=\"../web-admin/src/TeamCompanion.tsx\">Ansicht\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"../web-admin/src/PointFlow.tsx\">Verläufe\u003c/a> und \u003ca href=\"../web-admin/src/matchHistoryData.ts\">Nachladen\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"../web-admin/src/displayPolling.ts\">Polling\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"../web-admin/src/admin/TeamPhotosPanel.tsx\">Fotoeditor\u003c/a> und \u003ca href=\"../web-admin/src/teamPhotos.ts\">Foto-API\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"../supabase/migrations/20260916160000_team_photos.sql\">Fotoschema/Rechte\u003c/a> und \u003ca href=\"../supabase/migrations/20260916161000_team_photo_admin_read.sql\">Storage-Lesekorrektur\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"../web-admin/tests/team-companion.test.mjs\">Begleitertests\u003c/a> und \u003ca href=\"../web-admin/tests/match-history.test.mjs\">Verlaufstests\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch2>Offene Punkte\u003c/h2>\n\u003cp>Implementierung gelesen, Tests vorhanden; kein aktueller Anwendungstestlauf. Für Fotoeditor/Storage-Upload ist in den gesichteten Reports kein eigener Nachweis vorhanden. Browserfavoriten sind kein geräteübergreifendes Benutzerkonto. Aktuelle Produktionsrechte ungeprüft.\u003c/p>", "search": "\n# öffentliche anzeigen und team-begleiter\n\ndie routen unterstützen courts, gruppen, stream-overlay und eine persönliche teamseite.\ndie teamfavoriten werden je turnier im browser gehalten; gruppen-/pool- und bracket-platzhalter\nsind keine auswählbaren teamidentitäten. teamseiten sind über url teilbar.\nder begleiter zeigt ausstehende spiele und schiedsrichterdienste samt vorausgehenden spielen\nauf demselben court. gewinner-/verliererreferenzen werden nur aus abgeschlossenen ergebnissen\naufgelöst; unbekannte referenzen bleiben sichtbar. ergebnisse werden aus sicht des gewählten\nteams angezeigt, einschließlich satzständen und sonderwertungen.\n\npunktverlauf und auszeiten verwenden die gemeinsame pointflow-darstellung. diese öffentlichen\nergebnisdaten sind vom privaten [adminprotokoll](protocols.md) zu unterscheiden.\ndie übersicht fragt kompakte spielzusammenfassungen ab; detaillierte verläufe werden bei bedarf\ngeladen. der historisch dokumentierte fünf-sekunden-abfragezyklus ist keine echtzeitgarantie.\n\nteamfotos sind im adminbereich je turnier und setznummer zugeordnet. der editor erstellt einen\n512×512-webp-ausschnitt mit verschieben und zoom; die anzeige verwendet öffentliche storage-urls.\ndateiupload und metadaten-upsert sind getrennte schritte. im lokalen datenmodus liefert die\nfotoliste derzeit keine fotos. uploadrechte betreffen berechtigte turnieradmins.\n\n## quellen\n\n- [routen](../../../web-admin/src/approutes.tsx)\n- [favoriten](../../../web-admin/src/myteam.tsx) und [teamfilter](../../../web-admin/src/teamnames.ts)\n- [begleiterlogik](../../../web-admin/src/teamcompanionlogic.ts) und [ansicht](../../../web-admin/src/teamcompanion.tsx)\n- [verläufe](../../../web-admin/src/pointflow.tsx) und [nachladen](../../../web-admin/src/matchhistorydata.ts)\n- [polling](../../../web-admin/src/displaypolling.ts)\n- [fotoeditor](../../../web-admin/src/admin/teamphotospanel.tsx) und [foto-api](../../../web-admin/src/teamphotos.ts)\n- [fotoschema/rechte](../../../supabase/migrations/20260916160000_team_photos.sql) und [storage-lesekorrektur](../../../supabase/migrations/20260916161000_team_photo_admin_read.sql)\n- [begleitertests](../../../web-admin/tests/team-companion.test.mjs) und [verlaufstests](../../../web-admin/tests/match-history.test.mjs)\n\n## offene punkte\n\nimplementierung gelesen, tests vorhanden; kein aktueller anwendungstestlauf.\nfür fotoeditor/storage-upload ist in den gesichteten reports kein eigener nachweis vorhanden.\nbrowserfavoriten sind kein geräteübergreifendes benutzerkonto. aktuelle produktionsrechte ungeprüft.\n", "meta": {"title": "Öffentliche Anzeigen und Team-Begleiter", "updated": "2026-09-17", "status": "source-reviewed", "source_commit": "0fa17d309b986079df46f12883f9996d7c3af467"}}, {"id": "features/hvv-referees.md", "title": "HVV-Import und Schiedsrichterplanung", "body": "\u003ch1>HVV-Import und Schiedsrichterplanung\u003c/h1>\n\u003cp>Der HVV-Turnierdialog kann vergangene Turniere ausdrücklich einschließen; standardmäßig werden abgelaufene Optionen ausgefiltert. Importspielnummern werden getrimmt, leere Nummern abgelehnt, identische Doppelzeilen dedupliziert und widersprüchliche Doppelnummern abgewiesen.\u003c/p>\n\u003cp>Schiedsrichtervorschläge sind Empfehlungen und ersetzen keine importierte oder manuelle Zuweisung. In Gruppen wird unter verfügbaren Teams die bisherige Einsatzhäufigkeit berücksichtigt. Für K.-o.-Runden gelten Court-/Vorgängerspielregeln und Ausnahmen für Eröffnungsrunden; Final- oder unbekannte Runden erhalten keine automatischen Vorschläge. Manuelle Optionen umfassen auch Spielausgänge. HVV-Formularübertragung löst Team-/Setznummern und Gewinner-/Verliererreferenzen auf und verweigert uneindeutige Auswahlen.\u003c/p>\n\u003cp>Court-QR-PDFs enthalten Schiedsrichterlinks. Solche Links erlauben Ergebniserfassung und sind von öffentlichen Zuschauerlinks zu unterscheiden. Ergebnisübertragung läuft nach bestätigtem Abschluss über die separate HVV-Queue: lokale/Server-Speicherung und Verbandzustellung haben unterschiedliche Bestätigungen.\u003c/p>\n\u003ch2>Quellen\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"../supabase/functions/list-hvv-tournaments/index.ts\">Turnierfilter\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"../supabase/functions/_shared/import-games.ts\">Importvalidierung\u003c/a> und \u003ca href=\"../supabase/functions/sync-games/index.ts\">Sync\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"../web-admin/src/refereeSuggestions.ts\">Vorschlagsregeln\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"../supabase/functions/_shared/hvv-referee.ts\">HVV-Auswahlauflösung\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"../web-admin/src/courtQrPdf.ts\">QR-PDF\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"../supabase/functions/process-hvv-deliveries/index.ts\">HVV-Queue\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"../web-admin/tests/hvv-import.test.mjs\">Importtests\u003c/a>, \u003ca href=\"../web-admin/tests/hvv-referee-submit.test.mjs\">Formulartests\u003c/a> und \u003ca href=\"../web-admin/tests/referee-suggestions.test.mjs\">Vorschlagstests\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"../docs/reports/public-performance-2026-09-10.md\">Historische Zustellgrenzen\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch2>Offene Punkte\u003c/h2>\n\u003cp>Code und vorhandene Tests abgeglichen; kein aktueller Testlauf und keine reale HVV-Übertragung. HVV-Seitenänderungen können Parser/Formulare verändern. Empfehlungen garantieren keine vollständig konfliktfreie oder optimale Turnierplanung.\u003c/p>", "search": "\n# hvv-import und schiedsrichterplanung\n\nder hvv-turnierdialog kann vergangene turniere ausdrücklich einschließen; standardmäßig\nwerden abgelaufene optionen ausgefiltert. importspielnummern werden getrimmt, leere nummern\nabgelehnt, identische doppelzeilen dedupliziert und widersprüchliche doppelnummern abgewiesen.\n\nschiedsrichtervorschläge sind empfehlungen und ersetzen keine importierte oder manuelle zuweisung.\nin gruppen wird unter verfügbaren teams die bisherige einsatzhäufigkeit berücksichtigt.\nfür k.-o.-runden gelten court-/vorgängerspielregeln und ausnahmen für eröffnungsrunden;\nfinal- oder unbekannte runden erhalten keine automatischen vorschläge. manuelle optionen\numfassen auch spielausgänge. hvv-formularübertragung löst team-/setznummern und\ngewinner-/verliererreferenzen auf und verweigert uneindeutige auswahlen.\n\ncourt-qr-pdfs enthalten schiedsrichterlinks. solche links erlauben ergebniserfassung und sind\nvon öffentlichen zuschauerlinks zu unterscheiden. ergebnisübertragung läuft nach bestätigtem\nabschluss über die separate hvv-queue: lokale/server-speicherung und verbandzustellung\nhaben unterschiedliche bestätigungen.\n\n## quellen\n\n- [turnierfilter](../../../supabase/functions/list-hvv-tournaments/index.ts)\n- [importvalidierung](../../../supabase/functions/_shared/import-games.ts) und [sync](../../../supabase/functions/sync-games/index.ts)\n- [vorschlagsregeln](../../../web-admin/src/refereesuggestions.ts)\n- [hvv-auswahlauflösung](../../../supabase/functions/_shared/hvv-referee.ts)\n- [qr-pdf](../../../web-admin/src/courtqrpdf.ts)\n- [hvv-queue](../../../supabase/functions/process-hvv-deliveries/index.ts)\n- [importtests](../../../web-admin/tests/hvv-import.test.mjs), [formulartests](../../../web-admin/tests/hvv-referee-submit.test.mjs) und [vorschlagstests](../../../web-admin/tests/referee-suggestions.test.mjs)\n- [historische zustellgrenzen](../../../docs/reports/public-performance-2026-09-10.md)\n\n## offene punkte\n\ncode und vorhandene tests abgeglichen; kein aktueller testlauf und keine reale hvv-übertragung.\nhvv-seitenänderungen können parser/formulare verändern. empfehlungen garantieren keine\nvollständig konfliktfreie oder optimale turnierplanung.\n", "meta": {"title": "HVV-Import und Schiedsrichterplanung", "updated": "2026-09-17", "status": "source-reviewed", "source_commit": "0fa17d309b986079df46f12883f9996d7c3af467"}}, {"id": "features/youtube-replays.md", "title": "YouTube-Spielaufzeichnungen", "body": "\u003ch1>YouTube-Spielaufzeichnungen\u003c/h1>\n\u003cp>Beim ersten Satzbeginn werden Spielzeit, Court und Videozuordnung erfasst; beim Abschluss wird die Endzeit gespeichert. Timingdaten durchlaufen dieselbe Offline-Outbox und persistierte Erfassungssitzung wie Punkte. Der Datenbanktrigger erfasst den aktuellen Court-Stream beim Spielstart; eine eigene Migration ergänzt fehlende Zuordnungen bei geeigneten Bestandsdaten. Dies ist keine pauschale rückwirkende Zuordnung sämtlicher Altspiele.\u003c/p>\n\u003cp>Der öffentliche Replay-Link setzt abgeschlossenes Spiel, gültige Zeiten, Video-ID und Aufzeichnungsbeginn voraus. Position: Spielbeginn minus Aufzeichnungsbeginn plus Korrektur, abzüglich 15 Sekunden Vorlauf, frühestens 0. Spiele vor Aufzeichnungsbeginn erhalten keinen Link. Admins können Beginn/Korrektur manuell setzen oder YouTube-Metadaten abrufen. Ein manueller Beginn bleibt bei automatischem Abruf erhalten; fehlende Metadaten blockieren Ergebnisse nicht. Konkrete Videolinks, korrekte Geräteuhren und weiterhin verfügbare Aufzeichnungen sind erforderlich.\u003c/p>\n\u003cp>Unter Courts → Livestream sind Speichern und Entfernen getrennte Aktionen. Speichern ist nur bei einem nicht leeren, gegenüber dem gespeicherten Wert geänderten Entwurf aktiv; Entfernen nur bei einem tatsächlich gespeicherten Stream. Beide Aktionen werden während der laufenden Speicherung gesperrt.\u003c/p>\n\u003cp>Der Aufzeichnungsbeginn ist als einmalige mobile Einrichtung gestaltet. Die aktuelle Gerätezeit kann direkt gespeichert, der Beginn von YouTube übernommen oder manuell gewählt werden. Danach bleiben nur Zeitpunkt, Quelle und „Einstellung ändern“ sichtbar. Ältere Video-IDs und der Video-Versatz liegen in der Bearbeitung beziehungsweise Feineinstellung.\u003c/p>\n\u003ch2>Quellen\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"../docs/youtube-replays.md\">Bedienung und Grenzen\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"../web-admin/src/youtubeReplay.ts\">Linkberechnung\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"../supabase/functions/youtube-recording/index.ts\">Metadatenfunktion\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"../supabase/migrations/20260916090000_youtube_match_replays.sql\">Replay-Schema\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"../supabase/migrations/20260916130000_capture_current_court_stream.sql\">Stream-Erfassung\u003c/a> und \u003ca href=\"../supabase/migrations/20260916131000_backfill_missing_match_stream.sql\">gezielter Backfill\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"../web-admin/tests/youtube-replay.test.mjs\">Frontendtests\u003c/a>, \u003ca href=\"../scripts/test-youtube-settings-browser.mjs\">mobiler Browser-Test\u003c/a> und \u003ca href=\"../supabase/tests/youtube_replays.sql\">SQL-Tests\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"../web-admin/src/admin/CourtLinksPanel.tsx\">Livestream-Bedienung\u003c/a>, \u003ca href=\"../web-admin/tests/court-stream.test.mjs\">Zustandstest\u003c/a> und \u003ca href=\"../scripts/test-court-stream-browser.mjs\">Browser-Test\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch2>Offene Punkte\u003c/h2>\n\u003cp>Implementierung und Tests vorhanden; am 19.09.2026 wurde der vollständige lokale Frontend-Check mit lokalem Arbeitsbaum erfolgreich ausgeführt. Ein Playwright-Test mit lokalem Google Chrome bestätigte die Livestream-Schaltflächen einschließlich mobiler Breite. Ein weiterer mobiler Browserlauf bestätigte die einmalige Einrichtung des Aufzeichnungsbeginns, den kompakten Status, manuelle Bearbeitung und Versatzsteuerung. Kein Live-YouTube-Abruf. Nachträgliche Videoschnitte und unterschiedliche Versätze innerhalb eines Videos können mit einer einzigen Zeitkorrektur nicht vollständig ausgeglichen werden.\u003c/p>", "search": "\n# youtube-spielaufzeichnungen\n\nbeim ersten satzbeginn werden spielzeit, court und videozuordnung erfasst; beim abschluss\nwird die endzeit gespeichert. timingdaten durchlaufen dieselbe offline-outbox und persistierte\nerfassungssitzung wie punkte. der datenbanktrigger erfasst den aktuellen court-stream beim\nspielstart; eine eigene migration ergänzt fehlende zuordnungen bei geeigneten bestandsdaten.\ndies ist keine pauschale rückwirkende zuordnung sämtlicher altspiele.\n\nder öffentliche replay-link setzt abgeschlossenes spiel, gültige zeiten, video-id und\naufzeichnungsbeginn voraus. position: spielbeginn minus aufzeichnungsbeginn plus korrektur,\nabzüglich 15 sekunden vorlauf, frühestens 0. spiele vor aufzeichnungsbeginn erhalten keinen link.\nadmins können beginn/korrektur manuell setzen oder youtube-metadaten abrufen. ein manueller\nbeginn bleibt bei automatischem abruf erhalten; fehlende metadaten blockieren ergebnisse nicht.\nkonkrete videolinks, korrekte geräteuhren und weiterhin verfügbare aufzeichnungen sind erforderlich.\n\nunter courts → livestream sind speichern und entfernen getrennte aktionen. speichern ist\nnur bei einem nicht leeren, gegenüber dem gespeicherten wert geänderten entwurf aktiv;\nentfernen nur bei einem tatsächlich gespeicherten stream. beide aktionen werden während\nder laufenden speicherung gesperrt.\n\nder aufzeichnungsbeginn ist als einmalige mobile einrichtung gestaltet. die aktuelle\ngerätezeit kann direkt gespeichert, der beginn von youtube übernommen oder manuell gewählt\nwerden. danach bleiben nur zeitpunkt, quelle und „einstellung ändern“ sichtbar. ältere\nvideo-ids und der video-versatz liegen in der bearbeitung beziehungsweise feineinstellung.\n\n## quellen\n\n- [bedienung und grenzen](../../../docs/youtube-replays.md)\n- [linkberechnung](../../../web-admin/src/youtubereplay.ts)\n- [metadatenfunktion](../../../supabase/functions/youtube-recording/index.ts)\n- [replay-schema](../../../supabase/migrations/20260916090000_youtube_match_replays.sql)\n- [stream-erfassung](../../../supabase/migrations/20260916130000_capture_current_court_stream.sql) und [gezielter backfill](../../../supabase/migrations/20260916131000_backfill_missing_match_stream.sql)\n- [frontendtests](../../../web-admin/tests/youtube-replay.test.mjs), [mobiler browser-test](../../../scripts/test-youtube-settings-browser.mjs) und [sql-tests](../../../supabase/tests/youtube_replays.sql)\n- [livestream-bedienung](../../../web-admin/src/admin/courtlinkspanel.tsx), [zustandstest](../../../web-admin/tests/court-stream.test.mjs) und [browser-test](../../../scripts/test-court-stream-browser.mjs)\n\n## offene punkte\n\nimplementierung und tests vorhanden; am 19.09.2026 wurde der vollständige lokale\nfrontend-check mit lokalem arbeitsbaum erfolgreich ausgeführt. ein playwright-test mit\nlokalem google chrome bestätigte die livestream-schaltflächen einschließlich mobiler breite.\nein weiterer mobiler browserlauf bestätigte die einmalige einrichtung des aufzeichnungsbeginns,\nden kompakten status, manuelle bearbeitung und versatzsteuerung.\nkein live-youtube-abruf.\nnachträgliche videoschnitte und unterschiedliche versätze innerhalb eines videos können\nmit einer einzigen zeitkorrektur nicht vollständig ausgeglichen werden.\n", "meta": {"title": "YouTube-Spielaufzeichnungen", "updated": "2026-09-19", "status": "source-reviewed", "source_commit": "4351b5717318ff4231d202aacbb15de3b5daa85b"}}, {"id": "decisions/implementation.md", "title": "Belegte Implementierungsentscheidungen", "body": "\u003ch1>Belegte Implementierungsentscheidungen\u003c/h1>\n\u003cp>Die folgenden Entscheidungen sind aus Git-Historie und aktuellen Quellen abgeleitet. Die Commit-Meldungen belegen Umsetzungsschritte; darüber hinausgehende Motive werden nicht behauptet.\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003ctr>\u003cth>Historie\u003c/th>\u003cth>Umsetzung\u003c/th>\u003cth>Konsequenz\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>706fbcc\u003c/code>, \u003ccode>ac1c0e9\u003c/code>\u003c/td>\u003ctd>Versionierte Outbox und persistierte Score-Session\u003c/td>\u003ctd>Serverbestätigung von lokaler Sicherung trennen; Gerätewechsel braucht bestätigten Zustand\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>724a533\u003c/code>, \u003ccode>61a2a4d\u003c/code>\u003c/td>\u003ctd>Konflikt-Recovery schließlich automatisch mit Serverstand\u003c/td>\u003ctd>Kein Merge; unbestätigte Pending-Änderungen werden bei Übernahme ersetzt\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>a31babe\u003c/code>, \u003ccode>42929ca\u003c/code>, \u003ccode>90dafb1\u003c/code>\u003c/td>\u003ctd>Teilbare Teamseiten, eigene Ergebnisperspektive, gemeinsame Punktdarstellung\u003c/td>\u003ctd>Öffentliche Ergebnisdaten bleiben vom privaten Auditarchiv getrennt\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>183a756\u003c/code>, \u003ccode>aeb18b2\u003c/code>\u003c/td>\u003ctd>Eindeutige Importnummern und validierte HVV-Schiedsrichterauswahl\u003c/td>\u003ctd>Uneindeutige Quell-/Formulardaten ablehnen\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>c6bdc4d\u003c/code>, \u003ccode>d5876ec\u003c/code>\u003c/td>\u003ctd>Timing plus Streamzuordnung beim Start\u003c/td>\u003ctd>Replay hängt vom damaligen Video und kalibriertem Beginn ab\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>0476b20\u003c/code>\u003c/td>\u003ctd>Funktionsrechte explizit vergeben; Build-Abhängigkeiten aktualisiert\u003c/td>\u003ctd>Neue RPCs nicht durch historische öffentliche Defaults freigeben\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>8e6a0d8\u003c/code>, \u003ccode>0fa17d3\u003c/code>\u003c/td>\u003ctd>Öffentliche Teamfotos und verschiebbarer Ausschnitt\u003c/td>\u003ctd>Fotos sind öffentliche Assets; Upload und Metadaten sind separate Schritte\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003ch2>Quellen\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"../web-admin/src/scoreOutbox.ts\">Outbox\u003c/a> und \u003ca href=\"../web-admin/src/ScoreSyncStatus.tsx\">Wiederaufnahme\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"../web-admin/src/teamCompanionLogic.ts\">Teamlogik\u003c/a> und \u003ca href=\"../web-admin/src/PointFlow.tsx\">Punktdarstellung\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"../supabase/functions/_shared/import-games.ts\">HVV-Import\u003c/a> und \u003ca href=\"../supabase/functions/_shared/hvv-referee.ts\">Formularauswahl\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"../docs/youtube-replays.md\">Replay-Dokumentation\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"../supabase/migrations/20260916150000_harden_database_function_privileges.sql\">Rechtehärtung\u003c/a> und \u003ca href=\"../supabase/tests/function_privileges.sql\">Regression\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"../web-admin/package-lock.json\">Abhängigkeiten\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"../web-admin/src/admin/TeamPhotosPanel.tsx\">Fotoeditor\u003c/a>\u003c/li>\n\u003cli>Git: \u003ccode>git log -45 --oneline\u003c/code>, \u003ccode>git show --stat 0476b20\u003c/code>; ausgeführt beim Quellenabgleich am 17.09.2026.\u003c/li>\n\u003c/ul>\n\u003ch2>Offene Punkte\u003c/h2>\n\u003cp>Keine formellen ADRs für sämtliche historischen Schritte vorhanden; diese Tabelle ist eine belegte Zusammenfassung und kein nachträglich erfundener ursprünglicher Beschluss. Implementierung gelesen und Tests verlinkt, nicht heute ausgeführt oder produktiv verifiziert. Detaillierte vollständige Prüfung jedes Java-/Adminpfads bleibt außerhalb dieses Themenabgleichs.\u003c/p>", "search": "\n# belegte implementierungsentscheidungen\n\ndie folgenden entscheidungen sind aus git-historie und aktuellen quellen abgeleitet.\ndie commit-meldungen belegen umsetzungsschritte; darüber hinausgehende motive werden nicht behauptet.\n\n| historie | umsetzung | konsequenz |\n| --- | --- | --- |\n| `706fbcc`, `ac1c0e9` | versionierte outbox und persistierte score-session | serverbestätigung von lokaler sicherung trennen; gerätewechsel braucht bestätigten zustand |\n| `724a533`, `61a2a4d` | konflikt-recovery schließlich automatisch mit serverstand | kein merge; unbestätigte pending-änderungen werden bei übernahme ersetzt |\n| `a31babe`, `42929ca`, `90dafb1` | teilbare teamseiten, eigene ergebnisperspektive, gemeinsame punktdarstellung | öffentliche ergebnisdaten bleiben vom privaten auditarchiv getrennt |\n| `183a756`, `aeb18b2` | eindeutige importnummern und validierte hvv-schiedsrichterauswahl | uneindeutige quell-/formulardaten ablehnen |\n| `c6bdc4d`, `d5876ec` | timing plus streamzuordnung beim start | replay hängt vom damaligen video und kalibriertem beginn ab |\n| `0476b20` | funktionsrechte explizit vergeben; build-abhängigkeiten aktualisiert | neue rpcs nicht durch historische öffentliche defaults freigeben |\n| `8e6a0d8`, `0fa17d3` | öffentliche teamfotos und verschiebbarer ausschnitt | fotos sind öffentliche assets; upload und metadaten sind separate schritte |\n\n## quellen\n\n- [outbox](../../../web-admin/src/scoreoutbox.ts) und [wiederaufnahme](../../../web-admin/src/scoresyncstatus.tsx)\n- [teamlogik](../../../web-admin/src/teamcompanionlogic.ts) und [punktdarstellung](../../../web-admin/src/pointflow.tsx)\n- [hvv-import](../../../supabase/functions/_shared/import-games.ts) und [formularauswahl](../../../supabase/functions/_shared/hvv-referee.ts)\n- [replay-dokumentation](../../../docs/youtube-replays.md)\n- [rechtehärtung](../../../supabase/migrations/20260916150000_harden_database_function_privileges.sql) und [regression](../../../supabase/tests/function_privileges.sql)\n- [abhängigkeiten](../../../web-admin/package-lock.json)\n- [fotoeditor](../../../web-admin/src/admin/teamphotospanel.tsx)\n- git: `git log -45 --oneline`, `git show --stat 0476b20`; ausgeführt beim quellenabgleich am 17.09.2026.\n\n## offene punkte\n\nkeine formellen adrs für sämtliche historischen schritte vorhanden; diese tabelle ist eine\nbelegte zusammenfassung und kein nachträglich erfundener ursprünglicher beschluss.\nimplementierung gelesen und tests verlinkt, nicht heute ausgeführt oder produktiv verifiziert.\ndetaillierte vollständige prüfung jedes java-/adminpfads bleibt außerhalb dieses themenabgleichs.\n", "meta": {"title": "Belegte Implementierungsentscheidungen", "updated": "2026-09-17", "status": "source-reviewed", "source_commit": "0fa17d309b986079df46f12883f9996d7c3af467"}}, {"id": "testing/strategy.md", "title": "Teststrategie und Abdeckung", "body": "\u003ch1>Teststrategie und Abdeckung\u003c/h1>\n\u003cp>Tests haben eine feste Verantwortung und bilden ein Abschlusskriterium für funktionale Änderungen. Implementierende Agenten testen ihre Änderungen; ein unabhängiger Test-Agent prüft Integration, Fehlerfälle und Regressionen. Kleine reine Dokumentationsänderungen benötigen passende Dokumentationsprüfungen statt eines vollständigen Anwendungsbuilds.\u003c/p>\n\u003ch2>Vorhandene Prüfungen\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003ctr>\u003cth>Ebene\u003c/th>\u003cth>Einstieg\u003c/th>\u003cth>Grenze\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Node-Tests, TypeScript, Build\u003c/td>\u003ctd>\u003ccode>npm --prefix web-admin run check\u003c/code>\u003c/td>\u003ctd>Kein vollständiger Browser-/Datenbanklauf\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Datenbank\u003c/td>\u003ctd>SQL-Dateien unter \u003ccode>supabase/tests/\u003c/code>\u003c/td>\u003ctd>Entwicklungsdatenbank und Migrationen erforderlich; Runner vor Ausführung klären\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Browser\u003c/td>\u003ctd>Skripte unter \u003ccode>scripts/test-*-browser.mjs\u003c/code>\u003c/td>\u003ctd>Playwright/Chromium und je Skript passende Serverkonfiguration\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Java-Gerätewechsel\u003c/td>\u003ctd>\u003ccode>mvn test-compile\u003c/code>, danach \u003ccode>java -ea -cp target/classes:target/test-classes org.example.ScoreSessionPersistenceTest\u003c/code>\u003c/td>\u003ctd>Eigenständiger Assertions-Test; nicht automatisch ein JUnit-Lauf\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Wiki\u003c/td>\u003ctd>\u003ccode>python3 scripts/check-knowledge.py\u003c/code>\u003c/td>\u003ctd>Struktur, keine semantische Wahrheitsprüfung\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cp>\u003ccode>npm run check\u003c/code> umfasst inzwischen auch Auth, Anzeige, HVV-Import/Zustellung/Formulare, Protokolle, Court-QR, Schiedsrichtervorschläge und Team-Begleiter mit Verlauf/Replay. Vorhandene SQL-Suiten ergänzen Score-Session, YouTube und Funktionsrechte. Die bloße Existenz dieser Tests ist kein aktueller Erfolgsnachweis; siehe \u003ca href=\"#testing/evidence.md\">Nachweise\u003c/a>.\u003c/p>\n\u003cp>Die Browserberichte für Erfassung und Protokolle beschreiben simulierte Supabase-Antworten. Das belegt Browserverhalten, nicht das Zusammenspiel mit einer echten Datenbank. Historische SQL-Berichte nutzen PGlite; gehostete Cron-/Netzwerkfunktionen wurden davon getrennt behandelt.\u003c/p>\n\u003ch2>Prioritäten für funktionale Änderungen\u003c/h2>\n\u003cul>\n\u003cli>Erfassung: Reihenfolge, doppelte Requests, Revisionskonflikte und Court-/Gerätesperren.\u003c/li>\n\u003cli>Offline: Verbindungsabbruch, Antwortverlust, Neuladen, Wiederaufnahme und Gerätewechsel.\u003c/li>\n\u003cli>Rechte: Superadmin/Admin, anonyme Zuschauer, Spiel-/Court-Tokens und private Protokolle.\u003c/li>\n\u003cli>Integrationen: HVV-Fehler, Wiederholung, Leases und getrennte Speicher-/Lieferbestätigung.\u003c/li>\n\u003cli>Migrationen: bestehende Daten, Trigger, SQL-Funktionen und Rollenberechtigungen.\u003c/li>\n\u003cli>Browser: Login, Turnierverwaltung, QR-Link und kompletter Spielabschluss.\u003c/li>\n\u003c/ul>\n\u003cp>Für einen Auftrag Akzeptanzkriterien zuerst festlegen. Relevante Prüfungen erfolgreich abschließen; verbleibende Blockaden und Lücken ausdrücklich melden. Keine Tests gegen Live-Spiele starten. Gehostete Prüfungen benötigen einen autorisierten Umfang und isolierte Testdaten. Siehe \u003ca href=\"#testing/evidence.md\">Nachweise\u003c/a> und \u003ca href=\"#agent-roles.md\">Agenten\u003c/a>.\u003c/p>\n\u003ch2>Quellen\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"../knowledge/raw/2026-09-17-requirements.md\">Nutzerprioritäten\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"../web-admin/package.json\">Testbefehle\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"../supabase/tests/reliable_score_operations.sql\">SQL-Suite für Erfassung\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"../supabase/tests/function_privileges.sql\">SQL-Suite für Rechte\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"../scripts/test-score-browser.mjs\">Browser-Erfassung\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"../scripts/test-score-device-handover.mjs\">Browser-Gerätewechsel\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"../src/test/java/org/example/ScoreSessionPersistenceTest.java\">Java-Test\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"../docs/reports/reliable-scoring-2026-09-11.md\">Historische Testumgebungen\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch2>Offene Punkte\u003c/h2>\n\u003cp>Der Pages-Workflow führt derzeit nur den Build aus; \u003ccode>npm run check\u003c/code>, SQL- und Browserprüfungen sind dort keine Deployment-Voraussetzung. Ein verbindliches CI-Testgate ist noch umzusetzen. Ein vollständiger aktueller E2E-Nachweis mit echter Supabase-Instanz ist hier nicht belegt.\u003c/p>", "search": "\n# teststrategie und abdeckung\n\ntests haben eine feste verantwortung und bilden ein abschlusskriterium für funktionale änderungen.\nimplementierende agenten testen ihre änderungen; ein unabhängiger test-agent prüft integration,\nfehlerfälle und regressionen. kleine reine dokumentationsänderungen benötigen passende\ndokumentationsprüfungen statt eines vollständigen anwendungsbuilds.\n\n## vorhandene prüfungen\n\n| ebene | einstieg | grenze |\n| --- | --- | --- |\n| node-tests, typescript, build | `npm --prefix web-admin run check` | kein vollständiger browser-/datenbanklauf |\n| datenbank | sql-dateien unter `supabase/tests/` | entwicklungsdatenbank und migrationen erforderlich; runner vor ausführung klären |\n| browser | skripte unter `scripts/test-*-browser.mjs` | playwright/chromium und je skript passende serverkonfiguration |\n| java-gerätewechsel | `mvn test-compile`, danach `java -ea -cp target/classes:target/test-classes org.example.scoresessionpersistencetest` | eigenständiger assertions-test; nicht automatisch ein junit-lauf |\n| wiki | `python3 scripts/check-knowledge.py` | struktur, keine semantische wahrheitsprüfung |\n\n`npm run check` umfasst inzwischen auch auth, anzeige, hvv-import/zustellung/formulare,\nprotokolle, court-qr, schiedsrichtervorschläge und team-begleiter mit verlauf/replay.\nvorhandene sql-suiten ergänzen score-session, youtube und funktionsrechte. die bloße\nexistenz dieser tests ist kein aktueller erfolgsnachweis; siehe [nachweise](evidence.md).\n\ndie browserberichte für erfassung und protokolle beschreiben simulierte supabase-antworten.\ndas belegt browserverhalten, nicht das zusammenspiel mit einer echten datenbank.\nhistorische sql-berichte nutzen pglite; gehostete cron-/netzwerkfunktionen wurden davon getrennt behandelt.\n\n## prioritäten für funktionale änderungen\n\n- erfassung: reihenfolge, doppelte requests, revisionskonflikte und court-/gerätesperren.\n- offline: verbindungsabbruch, antwortverlust, neuladen, wiederaufnahme und gerätewechsel.\n- rechte: superadmin/admin, anonyme zuschauer, spiel-/court-tokens und private protokolle.\n- integrationen: hvv-fehler, wiederholung, leases und getrennte speicher-/lieferbestätigung.\n- migrationen: bestehende daten, trigger, sql-funktionen und rollenberechtigungen.\n- browser: login, turnierverwaltung, qr-link und kompletter spielabschluss.\n\nfür einen auftrag akzeptanzkriterien zuerst festlegen. relevante prüfungen erfolgreich\nabschließen; verbleibende blockaden und lücken ausdrücklich melden. keine tests gegen\nlive-spiele starten. gehostete prüfungen benötigen einen autorisierten umfang und isolierte testdaten.\nsiehe [nachweise](evidence.md) und [agenten](../agent-roles.md).\n\n## quellen\n\n- [nutzerprioritäten](../../raw/2026-09-17-requirements.md)\n- [testbefehle](../../../web-admin/package.json)\n- [sql-suite für erfassung](../../../supabase/tests/reliable_score_operations.sql)\n- [sql-suite für rechte](../../../supabase/tests/function_privileges.sql)\n- [browser-erfassung](../../../scripts/test-score-browser.mjs)\n- [browser-gerätewechsel](../../../scripts/test-score-device-handover.mjs)\n- [java-test](../../../src/test/java/org/example/scoresessionpersistencetest.java)\n- [historische testumgebungen](../../../docs/reports/reliable-scoring-2026-09-11.md)\n\n## offene punkte\n\nder pages-workflow führt derzeit nur den build aus; `npm run check`, sql- und browserprüfungen\nsind dort keine deployment-voraussetzung. ein verbindliches ci-testgate ist noch umzusetzen.\nein vollständiger aktueller e2e-nachweis mit echter supabase-instanz ist hier nicht belegt.\n", "meta": {"title": "Teststrategie und Abdeckung", "updated": "2026-09-17", "status": "source-reviewed", "source_commit": "0fa17d309b986079df46f12883f9996d7c3af467"}}, {"id": "testing/evidence.md", "title": "Testnachweise", "body": "\u003ch1>Testnachweise\u003c/h1>\n\u003ch2>Historische Nachweise\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003ctr>\u003cth>Datum\u003c/th>\u003cth>Umfang\u003c/th>\u003cth>Umgebung\u003c/th>\u003cth>Ergebnis laut Quelle\u003c/th>\u003cth>Commit\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>11.09.2026\u003c/td>\u003ctd>Zuverlässige Erfassung\u003c/td>\u003ctd>Node, PGlite, Mock-Chromium, isolierte gehostete Lastfixture\u003c/td>\u003ctd>Prüfungen bestanden; Lastlauf ohne Speicherfehler\u003c/td>\u003ctd>Im Bericht nicht eindeutig angegeben\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>11.09.2026\u003c/td>\u003ctd>Spielprotokolle\u003c/td>\u003ctd>Node, PGlite, Mock-Chromium, isolierte gehostete Fixture\u003c/td>\u003ctd>Prüfungen bestanden; keine doppelten Abschlussereignisse\u003c/td>\u003ctd>Im Bericht nicht eindeutig angegeben\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cp>Das sind Aussagen der vorhandenen Berichte, keine in dieser Wiki-Einrichtung wiederholten Läufe. Metadatum \u003ccode>source_commit\u003c/code> dokumentiert nur den Repository-Stand, an dem die Berichte gelesen wurden.\u003c/p>\n\u003ch2>Weitere historische Berichte\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003ctr>\u003cth>Datum\u003c/th>\u003cth>Bericht\u003c/th>\u003cth>Einordnung und Grenzen\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>10.09.2026\u003c/td>\u003ctd>\u003ca href=\"../docs/reports/display-load-test-2026-09-10.md\">Öffentliche Anzeige\u003c/a>\u003c/td>\u003ctd>Öffentliche HTTP-Leseabfragen, Frontendstand \u003ccode>ce20c13\u003c/code>; kein Rendering oder Schreibtest\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>10.09.2026\u003c/td>\u003ctd>\u003ca href=\"../docs/reports/combined-load-test-2026-09-10.md\">Kombinierte Last\u003c/a>\u003c/td>\u003ctd>18 synthetische Spiele, 50 Leser/vier Schreiber; kein Abschluss/HVV, kurze Messung\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>10.09.2026\u003c/td>\u003ctd>\u003ca href=\"../docs/reports/public-performance-2026-09-10.md\">Kompakte Anzeige/Queue\u003c/a>\u003c/td>\u003ctd>Erfolgreicher zweiter Lauf mit 120 Spielen; erster Versuch mit einem ungeklärten 15-s-Timeout abgebrochen. Keine reale HVV-Zustellung\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>11.09.2026\u003c/td>\u003ctd>\u003ca href=\"../docs/reports/supabase-restart-2026-09-11.md\">Neustartvergleich\u003c/a>\u003c/td>\u003ctd>Einzelnes Vorher-/Nachher-Paar bei \u003ccode>f90d12b37cc38730314e8e24bf91d6749bf6da48\u003c/code>; begründet keine regelmäßigen Neustarts\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003cp>JSON-Rohmessungen liegen jeweils neben den Markdown-Berichten. HTTP-Last von einem Rechner ist kein Browser-, Mobilfunk- oder Livestreamtest; dekomprimiertes JSON ist keine Egressmessung. Die datierten gehosteten Fixtures in den Quellen belegen ausschließlich damalige Umgebungen.\u003c/p>\n\u003ch2>Aktuelle Wiki-Prüfung (17.09.2026)\u003c/h2>\n\u003cp>Quellenstand \u003ccode>0fa17d309b986079df46f12883f9996d7c3af467\u003c/code>, lokale Wissensdateien noch unversioniert. Für diesen Dokumentationsabgleich wird ausschließlich \u003ccode>python3 scripts/check-knowledge.py\u003c/code> lokal ausgeführt; Ergebnis im \u003ca href=\"#log.md\">Log\u003c/a>. Keine Anwendungstests und keine Live-Prüfung durchgeführt. Neuere Tests etwa für Companion, HVV-Import, Replays und Konfliktabgleich sind vorhanden, hier nicht bestanden erklärt.\u003c/p>\n\u003ch2>Lokaler Frontend-Lauf (19.09.2026)\u003c/h2>\n\u003cp>Für die getrennten Livestream-Aktionen unter Courts wurde \u003ccode>npm --prefix web-admin run check\u003c/code> auf HEAD \u003ccode>0fa17d309b986079df46f12883f9996d7c3af467\u003c/code> mit lokalen Änderungen ausgeführt. Die Node-Tests einschließlich des neuen Court-Stream-Zustandstests sowie TypeScript-Prüfung und Produktionsbuild waren erfolgreich. Da der zusammenhängende Lauf nach der Ausgabe der Referee-Tests an die Werkzeug-Zeitgrenze kam, wurden die noch nicht ausgegebenen Schritte \u003ccode>npm --prefix web-admin run test:companion\u003c/code> und \u003ccode>npm --prefix web-admin run build\u003c/code> separat erfolgreich abgeschlossen. Dieser Check selbst umfasst keine Browser-Interaktion.\u003c/p>\n\u003cp>Anschließend wurde \u003ccode>node scripts/test-court-stream-browser.mjs\u003c/code> gegen einen lokalen Vite-Devserver ausgeführt. Playwright steuerte den installierten Google Chrome headless bei 390 × 844 Pixeln. Der Lauf bestätigte Ausgangszustand, Linkeingabe, Speichern, unveränderten Zustand, Linkänderung, Entfernen, geleertes Feld und fehlenden horizontalen Überlauf. \u003ccode>playwright-core\u003c/code> wurde dafür nur im ignorierten \u003ccode>node_modules\u003c/code> installiert; Manifest und Lockfile blieben unverändert. Keine Netzwerk-, Backend- oder Live-YouTube-Interaktion.\u003c/p>\n\u003ch2>Mobile Einrichtung des Aufzeichnungsbeginns (19.09.2026)\u003c/h2>\n\u003cp>Auf HEAD \u003ccode>4351b5717318ff4231d202aacbb15de3b5daa85b\u003c/code> mit lokalen Änderungen steuerte \u003ccode>scripts/test-youtube-settings-browser.mjs\u003c/code> Google Chrome headless bei 390 × 844 Pixeln. Der Test bestätigte Speichern der aktuellen Gerätezeit mit einem Tipp, kompakten Status, manuelle Bearbeitung, nur bei mehreren Videos sichtbare Auswahl, Feineinstellung mit Fünf-Sekunden-Schritt und fehlenden horizontalen Überlauf. Supabase-Antworten waren vollständig simuliert; kein Live-YouTube- oder Datenbankzugriff. Zusätzlich erfolgreich: \u003ccode>npm --prefix web-admin run test:companion\u003c/code> und \u003ccode>npm --prefix web-admin run build\u003c/code>.\u003c/p>\n\u003ch2>Neuer Nachweis: Vorlage\u003c/h2>\n\u003cp>Für zukünftige Läufe einen Beleg in \u003ccode>knowledge/raw/\u003c/code> oder \u003ccode>docs/reports/\u003c/code> ablegen und hier verlinken:\u003c/p>\n\u003cul>\n\u003cli>Datum und ausführender Agent.\u003c/li>\n\u003cli>Commit und gegebenenfalls uncommittete Änderungen.\u003c/li>\n\u003cli>Exakter Befehl und Testumfang.\u003c/li>\n\u003cli>Umgebung: Mock, PGlite, lokales oder gehostetes Supabase; relevante Versionen.\u003c/li>\n\u003cli>Ergebnis: bestanden, fehlgeschlagen, übersprungen oder blockiert.\u003c/li>\n\u003cli>Grenzen, Fehler und Cleanup-Ergebnis bei temporären Daten.\u003c/li>\n\u003c/ul>\n\u003cp>Siehe \u003ca href=\"#testing/strategy.md\">Teststrategie\u003c/a>.\u003c/p>\n\u003ch2>Quellen\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"../docs/reports/reliable-scoring-2026-09-11.md\">Erfassungsbericht\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"../docs/reports/game-protocols-2026-09-11.md\">Protokollbericht\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch2>Offene Punkte\u003c/h2>\n\u003cp>Historische Commit-Zuordnung fehlt. Die Anwendungsprüfungen wurden für die Wiki-Einrichtung nicht ausgeführt.\u003c/p>", "search": "\n# testnachweise\n\n## historische nachweise\n\n| datum | umfang | umgebung | ergebnis laut quelle | commit |\n| --- | --- | --- | --- | --- |\n| 11.09.2026 | zuverlässige erfassung | node, pglite, mock-chromium, isolierte gehostete lastfixture | prüfungen bestanden; lastlauf ohne speicherfehler | im bericht nicht eindeutig angegeben |\n| 11.09.2026 | spielprotokolle | node, pglite, mock-chromium, isolierte gehostete fixture | prüfungen bestanden; keine doppelten abschlussereignisse | im bericht nicht eindeutig angegeben |\n\ndas sind aussagen der vorhandenen berichte, keine in dieser wiki-einrichtung wiederholten läufe.\nmetadatum `source_commit` dokumentiert nur den repository-stand, an dem die berichte gelesen wurden.\n\n## weitere historische berichte\n\n| datum | bericht | einordnung und grenzen |\n| --- | --- | --- |\n| 10.09.2026 | [öffentliche anzeige](../../../docs/reports/display-load-test-2026-09-10.md) | öffentliche http-leseabfragen, frontendstand `ce20c13`; kein rendering oder schreibtest |\n| 10.09.2026 | [kombinierte last](../../../docs/reports/combined-load-test-2026-09-10.md) | 18 synthetische spiele, 50 leser/vier schreiber; kein abschluss/hvv, kurze messung |\n| 10.09.2026 | [kompakte anzeige/queue](../../../docs/reports/public-performance-2026-09-10.md) | erfolgreicher zweiter lauf mit 120 spielen; erster versuch mit einem ungeklärten 15-s-timeout abgebrochen. keine reale hvv-zustellung |\n| 11.09.2026 | [neustartvergleich](../../../docs/reports/supabase-restart-2026-09-11.md) | einzelnes vorher-/nachher-paar bei `f90d12b37cc38730314e8e24bf91d6749bf6da48`; begründet keine regelmäßigen neustarts |\n\njson-rohmessungen liegen jeweils neben den markdown-berichten. http-last von einem rechner\nist kein browser-, mobilfunk- oder livestreamtest; dekomprimiertes json ist keine egressmessung.\ndie datierten gehosteten fixtures in den quellen belegen ausschließlich damalige umgebungen.\n\n## aktuelle wiki-prüfung (17.09.2026)\n\nquellenstand `0fa17d309b986079df46f12883f9996d7c3af467`, lokale wissensdateien noch\nunversioniert. für diesen dokumentationsabgleich wird ausschließlich\n`python3 scripts/check-knowledge.py` lokal ausgeführt; ergebnis im [log](../log.md).\nkeine anwendungstests und keine live-prüfung durchgeführt. neuere tests etwa für\ncompanion, hvv-import, replays und konfliktabgleich sind vorhanden, hier nicht bestanden erklärt.\n\n## lokaler frontend-lauf (19.09.2026)\n\nfür die getrennten livestream-aktionen unter courts wurde `npm --prefix web-admin run check`\nauf head `0fa17d309b986079df46f12883f9996d7c3af467` mit lokalen änderungen ausgeführt.\ndie node-tests einschließlich des neuen court-stream-zustandstests sowie typescript-prüfung\nund produktionsbuild waren erfolgreich. da der zusammenhängende lauf nach der ausgabe der\nreferee-tests an die werkzeug-zeitgrenze kam, wurden die noch nicht ausgegebenen schritte\n`npm --prefix web-admin run test:companion` und `npm --prefix web-admin run build` separat\nerfolgreich abgeschlossen. dieser check selbst umfasst keine browser-interaktion.\n\nanschließend wurde `node scripts/test-court-stream-browser.mjs` gegen einen lokalen\nvite-devserver ausgeführt. playwright steuerte den installierten google chrome headless bei\n390 × 844 pixeln. der lauf bestätigte ausgangszustand, linkeingabe, speichern, unveränderten\nzustand, linkänderung, entfernen, geleertes feld und fehlenden horizontalen überlauf.\n`playwright-core` wurde dafür nur im ignorierten `node_modules` installiert; manifest und\nlockfile blieben unverändert. keine netzwerk-, backend- oder live-youtube-interaktion.\n\n## mobile einrichtung des aufzeichnungsbeginns (19.09.2026)\n\nauf head `4351b5717318ff4231d202aacbb15de3b5daa85b` mit lokalen änderungen steuerte\n`scripts/test-youtube-settings-browser.mjs` google chrome headless bei 390 × 844 pixeln.\nder test bestätigte speichern der aktuellen gerätezeit mit einem tipp, kompakten status,\nmanuelle bearbeitung, nur bei mehreren videos sichtbare auswahl, feineinstellung mit\nfünf-sekunden-schritt und fehlenden horizontalen überlauf. supabase-antworten waren\nvollständig simuliert; kein live-youtube- oder datenbankzugriff. zusätzlich erfolgreich:\n`npm --prefix web-admin run test:companion` und `npm --prefix web-admin run build`.\n\n## neuer nachweis: vorlage\n\nfür zukünftige läufe einen beleg in `knowledge/raw/` oder `docs/reports/` ablegen und hier verlinken:\n\n- datum und ausführender agent.\n- commit und gegebenenfalls uncommittete änderungen.\n- exakter befehl und testumfang.\n- umgebung: mock, pglite, lokales oder gehostetes supabase; relevante versionen.\n- ergebnis: bestanden, fehlgeschlagen, übersprungen oder blockiert.\n- grenzen, fehler und cleanup-ergebnis bei temporären daten.\n\nsiehe [teststrategie](strategy.md).\n\n## quellen\n\n- [erfassungsbericht](../../../docs/reports/reliable-scoring-2026-09-11.md)\n- [protokollbericht](../../../docs/reports/game-protocols-2026-09-11.md)\n\n## offene punkte\n\nhistorische commit-zuordnung fehlt. die anwendungsprüfungen wurden für die wiki-einrichtung nicht ausgeführt.\n", "meta": {"title": "Testnachweise", "updated": "2026-09-19", "status": "historical-report", "source_commit": "0fa17d309b986079df46f12883f9996d7c3af467"}}, {"id": "operations/deployment.md", "title": "Betrieb und Veröffentlichung", "body": "\u003ch1>Betrieb und Veröffentlichung\u003c/h1>\n\u003cp>Der vorhandene GitHub-Actions-Workflow baut \u003ccode>web-admin\u003c/code> und veröffentlicht auf GitHub Pages. Ein Push auf \u003ccode>main\u003c/code> löst ihn aus; manueller Start ist ebenfalls konfiguriert. Der Build verwendet Supabase-URL und öffentlichen Browser-Schlüssel aus GitHub-Variablen. Privilegierte Schlüssel und Integrationsgeheimnisse gehören nicht in das Frontend oder die Wiki.\u003c/p>\n\u003cp>Die bestehende Betriebsdokumentation nennt für gekoppelte Änderungen die Reihenfolge: Migrationen, benötigte Secrets, Edge Functions, Frontend. Ein Frontenddeploy allein beweist nicht, dass Datenbank und Edge Functions zum selben Stand passen. \u003ccode>verify_jwt = false\u003c/code> ist für ausgewählte Funktionen konfiguriert und bedeutet nicht, dass sie ohne eigene Authentifizierung sicher aufgerufen werden können; die jeweilige Token-/Secret-Prüfung in der Funktion muss separat geprüft werden.\u003c/p>\n\u003cp>Siehe \u003ca href=\"#architecture/overview.md\">Architektur\u003c/a> und \u003ca href=\"#testing/strategy.md\">Testlücken\u003c/a>.\u003c/p>\n\u003ch2>Ergänzungen aus der aktuellen Historie\u003c/h2>\n\u003cp>Admin-Logout und Umgehung des Offline-Caches für Adminnavigation wurden mit \u003ccode>92086d4\u003c/code> eingeführt. Die Datenbankhärtung \u003ccode>0476b20\u003c/code> entzieht neue öffentliche Funktionsrechte standardmäßig und erlaubt bestimmte Adminfunktionen ausdrücklich für Authentifizierte und Service-Rolle. Das ist ein Schema-/Codebefund, keine Bestätigung produktiv angewendeter Migrationen. Die Rechte-Regression liegt als SQL-Test vor.\u003c/p>\n\u003ch2>Quellen\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"../web-admin/src/dataApiAuth.ts\">Adminauth\u003c/a> und \u003ca href=\"../web-admin/vite.config.ts\">Cache-Konfiguration\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"../supabase/migrations/20260916150000_harden_database_function_privileges.sql\">Funktionsrechte\u003c/a> und \u003ca href=\"../supabase/tests/function_privileges.sql\">SQL-Test\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"../.github/workflows/deploy-pages.yml\">Pages-Workflow\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"../docs/web-admin-setup.md\">Betriebsdokumentation\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"../supabase/config.toml\">Supabase-Konfiguration\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"../docs/youtube-replays.md\">YouTube-Secrets und Konfiguration\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch2>Offene Punkte\u003c/h2>\n\u003cp>Keine produktive Veröffentlichung oder Live-Konfigurationsprüfung bei Wiki-Einrichtung. Der Workflow enthält bisher kein vollständiges Testgate. Rückrollplan je Migration prüfen; keine pauschale Rücksetzbarkeit annehmen.\u003c/p>", "search": "\n# betrieb und veröffentlichung\n\nder vorhandene github-actions-workflow baut `web-admin` und veröffentlicht auf github pages.\nein push auf `main` löst ihn aus; manueller start ist ebenfalls konfiguriert.\nder build verwendet supabase-url und öffentlichen browser-schlüssel aus github-variablen.\nprivilegierte schlüssel und integrationsgeheimnisse gehören nicht in das frontend oder die wiki.\n\ndie bestehende betriebsdokumentation nennt für gekoppelte änderungen die reihenfolge:\nmigrationen, benötigte secrets, edge functions, frontend. ein frontenddeploy allein\nbeweist nicht, dass datenbank und edge functions zum selben stand passen.\n`verify_jwt = false` ist für ausgewählte funktionen konfiguriert und bedeutet nicht,\ndass sie ohne eigene authentifizierung sicher aufgerufen werden können; die jeweilige\ntoken-/secret-prüfung in der funktion muss separat geprüft werden.\n\nsiehe [architektur](../architecture/overview.md) und [testlücken](../testing/strategy.md).\n\n## ergänzungen aus der aktuellen historie\n\nadmin-logout und umgehung des offline-caches für adminnavigation wurden mit `92086d4`\neingeführt. die datenbankhärtung `0476b20` entzieht neue öffentliche funktionsrechte\nstandardmäßig und erlaubt bestimmte adminfunktionen ausdrücklich für authentifizierte\nund service-rolle. das ist ein schema-/codebefund, keine bestätigung produktiv angewendeter\nmigrationen. die rechte-regression liegt als sql-test vor.\n\n## quellen\n\n- [adminauth](../../../web-admin/src/dataapiauth.ts) und [cache-konfiguration](../../../web-admin/vite.config.ts)\n- [funktionsrechte](../../../supabase/migrations/20260916150000_harden_database_function_privileges.sql) und [sql-test](../../../supabase/tests/function_privileges.sql)\n- [pages-workflow](../../../.github/workflows/deploy-pages.yml)\n- [betriebsdokumentation](../../../docs/web-admin-setup.md)\n- [supabase-konfiguration](../../../supabase/config.toml)\n- [youtube-secrets und konfiguration](../../../docs/youtube-replays.md)\n\n## offene punkte\n\nkeine produktive veröffentlichung oder live-konfigurationsprüfung bei wiki-einrichtung.\nder workflow enthält bisher kein vollständiges testgate. rückrollplan je migration prüfen;\nkeine pauschale rücksetzbarkeit annehmen.\n", "meta": {"title": "Betrieb und Veröffentlichung", "updated": "2026-09-17", "status": "source-reviewed", "source_commit": "0fa17d309b986079df46f12883f9996d7c3af467"}}, {"id": "agent-roles.md", "title": "Agentenrollen und Übergaben", "body": "\u003ch1>Agentenrollen und Übergaben\u003c/h1>\n\u003cp>Der Hauptagent koordiniert die Projektarbeit, definiert Akzeptanzkriterien und weist Dateizuständigkeiten zu. Die Projektkonfiguration erlaubt höchstens drei gleichzeitige Subagenten. Kleine Aufgaben werden lokal erledigt; größere funktionale Änderungen erhalten eine unabhängige Testprüfung. Rollen laufen für konkrete delegierte Aufträge.\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003ctr>\u003cth>Rolle\u003c/th>\u003cth>Zuständigkeit\u003c/th>\u003cth>Konfiguration\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>frontend\u003c/td>\u003ctd>React/TypeScript, Oberfläche und Frontendtests\u003c/td>\u003ctd>\u003ca href=\"../.codex/agents/frontend.toml\">Frontend\u003c/a>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>database\u003c/td>\u003ctd>Migrationen, atomare SQL-Funktionen, RLS und Datenbanktests\u003c/td>\u003ctd>\u003ca href=\"../.codex/agents/database.toml\">Datenbank\u003c/a>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>backend\u003c/td>\u003ctd>Edge Functions, Authentifizierung, HVV-/YouTube-Integrationen\u003c/td>\u003ctd>\u003ca href=\"../.codex/agents/backend.toml\">Backend\u003c/a>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>test_agent\u003c/td>\u003ctd>Unabhängige Regressionen, Browser-/Integrationstests und Nachweise\u003c/td>\u003ctd>\u003ca href=\"../.codex/agents/test_agent.toml\">Tests\u003c/a>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>security_reviewer\u003c/td>\u003ctd>Lesendes Review von Rollen, Tokens und öffentlichen Zugriffen\u003c/td>\u003ctd>\u003ca href=\"../.codex/agents/security_reviewer.toml\">Sicherheit\u003c/a>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>wiki_agent\u003c/td>\u003ctd>Bestätigtes Projektwissen, Quellen, Index und Log pflegen\u003c/td>\u003ctd>\u003ca href=\"../.codex/agents/wiki_agent.toml\">Wiki\u003c/a>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>release_agent\u003c/td>\u003ctd>CI/Build, Release-Vorbereitung und Deployment-Abhängigkeiten\u003c/td>\u003ctd>\u003ca href=\"../.codex/agents/release_agent.toml\">Release\u003c/a>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>java_agent\u003c/td>\u003ctd>Java-Desktopanwendung, lokale API und Java-Regressionstests\u003c/td>\u003ctd>\u003ca href=\"../.codex/agents/java_agent.toml\">Java\u003c/a>\u003c/td>\u003c/tr>\n\u003c/table>\u003c/div>\n\u003ch2>Verwendung und Übergaben\u003c/h2>\n\u003cp>Beispielauftrag: „Nutze frontend und backend für die Änderung und lasse test_agent unabhängig prüfen. Dokumentiere bestätigte Ergebnisse mit wiki_agent.“\u003c/p>\n\u003cp>Eine Übergabe nennt Umfang, betroffene Dateien, Entscheidungen, tatsächlich ausgeführte Prüfungen mit Umgebung und Ergebnis sowie offene Aufgaben. Historische Nachweise ersetzen keinen heutigen Testlauf. Nur ein zugewiesener Agent schreibt gemeinsame Wiki-Seiten. Modelle und Reasoning werden laut Projektkonfiguration nicht je Rolle überschrieben; tatsächliche Werkzeugrechte ergeben sich aus der Sitzung. Rollen sind keine Pfad-Sandboxen.\u003c/p>\n\u003cp>Nach Aufträgen mit Änderungen fragt der Hauptagent abschließend nach Commit und Push. Subagenten übergeben ihren Arbeitsstand und führen diese Git-Aktionen nicht selbst aus. Ein bereits erteilter Commit-/Push-Auftrag wird ohne erneute Nachfrage ausgeführt.\u003c/p>\n\u003ch2>Schleifen vermeiden\u003c/h2>\n\u003cp>Die \u003ca href=\"../AGENTS.md\">Projektanweisungen\u003c/a> begrenzen denselben fehlgeschlagenen Schritt auf drei Versuche, einschließlich leicht veränderter Befehle mit gleicher Fehlerursache. Jeder neue Versuch braucht eine begründete Änderung oder einen erkennbar vorübergehenden Fehler. Danach wird der Lösungsweg gestoppt und ausgewertet. Alternative Wege brauchen neue Erkenntnisse; gescheiterte Wege dürfen nicht erneut durchlaufen werden. Bei einer Blockade wird der Arbeitsstand gesichert und die benötigte Information benannt. Unabhängige Arbeiten können weiterlaufen. Erfolgreiche Tests werden nur bei relevanten Änderungen oder konkreten Zweifeln wiederholt. Der Hauptagent überwacht auch Subagenten. Dies ist eine Verhaltensregel, kein technisch erzwungener Versuchszähler.\u003c/p>\n\u003ch2>Quellen\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"../AGENTS.md\">Projektanweisungen\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"../.codex/config.toml\">Projektkonfiguration\u003c/a>\u003c/li>\n\u003cli>Rollen-TOML-Dateien in der Tabelle und \u003ca href=\"#testing/strategy.md\">Teststrategie\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#AGENTS.md\">Wiki-Pflegeregeln\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch2>Offene Punkte\u003c/h2>\n\u003cp>Der Wiki-Agent wurde in dieser Sitzung für den Quellenabgleich eingesetzt. Die übrigen Rollen wurden dabei nicht durch eigene delegierte Aufträge zur Laufzeit geprüft. Der Dateiname \u003ccode>agent-roles.md\u003c/code> vermeidet die Kollision mit \u003ccode>AGENTS.md\u003c/code> auf Dateisystemen, die Groß-/Kleinschreibung nicht unterscheiden.\u003c/p>", "search": "\n# agentenrollen und übergaben\n\nder hauptagent koordiniert die projektarbeit, definiert akzeptanzkriterien und weist\ndateizuständigkeiten zu. die projektkonfiguration erlaubt höchstens drei gleichzeitige\nsubagenten. kleine aufgaben werden lokal erledigt; größere funktionale änderungen\nerhalten eine unabhängige testprüfung. rollen laufen für konkrete delegierte aufträge.\n\n| rolle | zuständigkeit | konfiguration |\n| --- | --- | --- |\n| frontend | react/typescript, oberfläche und frontendtests | [frontend](../../.codex/agents/frontend.toml) |\n| database | migrationen, atomare sql-funktionen, rls und datenbanktests | [datenbank](../../.codex/agents/database.toml) |\n| backend | edge functions, authentifizierung, hvv-/youtube-integrationen | [backend](../../.codex/agents/backend.toml) |\n| test_agent | unabhängige regressionen, browser-/integrationstests und nachweise | [tests](../../.codex/agents/test_agent.toml) |\n| security_reviewer | lesendes review von rollen, tokens und öffentlichen zugriffen | [sicherheit](../../.codex/agents/security_reviewer.toml) |\n| wiki_agent | bestätigtes projektwissen, quellen, index und log pflegen | [wiki](../../.codex/agents/wiki_agent.toml) |\n| release_agent | ci/build, release-vorbereitung und deployment-abhängigkeiten | [release](../../.codex/agents/release_agent.toml) |\n| java_agent | java-desktopanwendung, lokale api und java-regressionstests | [java](../../.codex/agents/java_agent.toml) |\n\n## verwendung und übergaben\n\nbeispielauftrag: „nutze frontend und backend für die änderung und lasse test_agent\nunabhängig prüfen. dokumentiere bestätigte ergebnisse mit wiki_agent.“\n\neine übergabe nennt umfang, betroffene dateien, entscheidungen, tatsächlich ausgeführte\nprüfungen mit umgebung und ergebnis sowie offene aufgaben. historische nachweise ersetzen\nkeinen heutigen testlauf. nur ein zugewiesener agent schreibt gemeinsame wiki-seiten.\nmodelle und reasoning werden laut projektkonfiguration nicht je rolle überschrieben;\ntatsächliche werkzeugrechte ergeben sich aus der sitzung. rollen sind keine pfad-sandboxen.\n\nnach aufträgen mit änderungen fragt der hauptagent abschließend nach commit und push.\nsubagenten übergeben ihren arbeitsstand und führen diese git-aktionen nicht selbst aus.\nein bereits erteilter commit-/push-auftrag wird ohne erneute nachfrage ausgeführt.\n\n## schleifen vermeiden\n\ndie [projektanweisungen](../../agents.md) begrenzen denselben fehlgeschlagenen schritt\nauf drei versuche, einschließlich leicht veränderter befehle mit gleicher fehlerursache.\njeder neue versuch braucht eine begründete änderung oder einen erkennbar vorübergehenden\nfehler. danach wird der lösungsweg gestoppt und ausgewertet. alternative wege brauchen\nneue erkenntnisse; gescheiterte wege dürfen nicht erneut durchlaufen werden.\nbei einer blockade wird der arbeitsstand gesichert und die benötigte information benannt.\nunabhängige arbeiten können weiterlaufen. erfolgreiche tests werden nur bei relevanten\nänderungen oder konkreten zweifeln wiederholt. der hauptagent überwacht auch subagenten.\ndies ist eine verhaltensregel, kein technisch erzwungener versuchszähler.\n\n## quellen\n\n- [projektanweisungen](../../agents.md)\n- [projektkonfiguration](../../.codex/config.toml)\n- rollen-toml-dateien in der tabelle und [teststrategie](testing/strategy.md)\n- [wiki-pflegeregeln](agents.md)\n\n## offene punkte\n\nder wiki-agent wurde in dieser sitzung für den quellenabgleich eingesetzt. die übrigen\nrollen wurden dabei nicht durch eigene delegierte aufträge zur laufzeit geprüft.\nder dateiname `agent-roles.md` vermeidet die kollision mit `agents.md` auf dateisystemen,\ndie groß-/kleinschreibung nicht unterscheiden.\n", "meta": {"title": "Agentenrollen und Übergaben", "updated": "2026-09-19", "status": "source-reviewed", "source_commit": "6b93bf9ff60bc042d1b9e38aa55e20fa4943aea8"}}, {"id": "decisions/llm-wiki.md", "title": "Entscheidung zur LLM-Wiki", "body": "\u003ch1>Entscheidung zur LLM-Wiki\u003c/h1>\n\u003cp>Der Nutzer hat die Einrichtung einer LLM-Wiki beauftragt. Als Umsetzung wird eine lokale, Git-versionierte Markdown-Wissensbasis gewählt: unveränderte Eingangsbelege, abgeleitete verlinkte Seiten und Regeln für Aufnahme, Fragen und Wartung. Bestehende Quellen im Repository werden referenziert statt dupliziert.\u003c/p>\n\u003cp>Die Anwendung braucht dafür keine neue Supabase-Tabelle. Die Wiki gehört zum Entwicklungsprozess und ist über Dateien lesbar. Auf späteren Nutzerwunsch gibt es eine lokale, erzeugte \u003ca href=\"../knowledge/reading.html\">Browser-Leseansicht\u003c/a> mit Themen-Navigation, Volltextsuche und Druckansicht. Die Markdown-Dateien bleiben die Wissensquelle. Der Generator verwendet nur Python-Standardbibliotheken; nach Änderungen ist ein erneuter Build erforderlich. Hintergrundautomatisierung ist nicht eingerichtet. Obsidian bleibt optional.\u003c/p>\n\u003cp>Projektanpassung: Code entwickelt sich weiter. Deshalb werden Quellen zusätzlich mit Commit und zeitlicher Gültigkeit eingeordnet. Historische Testberichte bleiben als historisch gekennzeichnet. Der Wiki-Agent ersetzt weder Testläufe noch Code-Review.\u003c/p>\n\u003ch2>Quellen\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"../knowledge/raw/2026-09-17-requirements.md\">Nutzerauftrag\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"https://gist.github.com/karpathy/442a6bf555914893e9891c11519de94f\">Karpathys Originalkonzept\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#AGENTS.md\">Umsetzungsregeln\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"../scripts/build-wiki-reader.py\">Generator der Leseansicht\u003c/a> und \u003ca href=\"../knowledge/README.md\">Benutzung\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch2>Offene Punkte\u003c/h2>\n\u003cp>Automatische CI-Wiki-Prüfung und verbindliche Anwendungstest-Gates sind mögliche Folgearbeiten.\u003c/p>", "search": "\n# entscheidung zur llm-wiki\n\nder nutzer hat die einrichtung einer llm-wiki beauftragt. als umsetzung wird eine lokale,\ngit-versionierte markdown-wissensbasis gewählt: unveränderte eingangsbelege, abgeleitete\nverlinkte seiten und regeln für aufnahme, fragen und wartung. bestehende quellen im\nrepository werden referenziert statt dupliziert.\n\ndie anwendung braucht dafür keine neue supabase-tabelle. die wiki gehört zum\nentwicklungsprozess und ist über dateien lesbar. auf späteren nutzerwunsch gibt es eine\nlokale, erzeugte [browser-leseansicht](../../reading.html) mit themen-navigation, volltextsuche\nund druckansicht. die markdown-dateien bleiben die wissensquelle. der generator verwendet\nnur python-standardbibliotheken; nach änderungen ist ein erneuter build erforderlich.\nhintergrundautomatisierung ist nicht eingerichtet. obsidian bleibt optional.\n\nprojektanpassung: code entwickelt sich weiter. deshalb werden quellen zusätzlich mit\ncommit und zeitlicher gültigkeit eingeordnet. historische testberichte bleiben als\nhistorisch gekennzeichnet. der wiki-agent ersetzt weder testläufe noch code-review.\n\n## quellen\n\n- [nutzerauftrag](../../raw/2026-09-17-requirements.md)\n- [karpathys originalkonzept](https://gist.github.com/karpathy/442a6bf555914893e9891c11519de94f)\n- [umsetzungsregeln](../agents.md)\n- [generat
